<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập trắc nghiệm – Giáo dục học</title>
<style>
  :root{
    --bg:#f3f7fb; --card:#ffffff; --ink:#26364a; --muted:#6b7c93;
    --primary:#4a7fd4; --primary-soft:#e6efff; --line:#dbe5f0;
    --ok:#2e9d6b; --ok-bg:#e3f6ec; --bad:#d9534f; --bad-bg:#fdeaea;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55}
  header{background:linear-gradient(135deg,#4a7fd4,#6aa5e8);color:#fff;padding:28px 16px 22px;text-align:center}
  header h1{margin:0 0 6px;font-size:1.55rem}
  header p{margin:0;opacity:.92;font-size:.95rem}
  .bar{position:sticky;top:0;z-index:10;background:rgba(243,247,251,.95);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:10px 16px}
  .bar-inner{max-width:1080px;margin:auto}
  .stats{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;font-size:.92rem}
  .stats b{font-size:1.02rem}
  .ok-t{color:var(--ok)} .bad-t{color:var(--bad)}
  .progress{height:8px;background:#dfe8f3;border-radius:99px;margin-top:8px;overflow:hidden}
  .progress>div{height:100%;width:0;background:var(--primary);transition:width .3s}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer}
  .btn{border:1px solid var(--primary);background:#fff;color:var(--primary);padding:6px 14px;border-radius:8px;font-size:.88rem}
  .btn:hover{background:var(--primary-soft)}
  .btn.main{background:var(--primary);color:#fff}
  .btn.main:hover{background:#3b6dbd}
  main{max-width:1080px;margin:18px auto 60px;padding:0 14px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
  .content{min-width:0}
  .nav{position:sticky;top:calc(var(--barh,90px) + 14px);display:flex;flex-wrap:wrap;gap:6px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px;max-height:calc(100vh - var(--barh,90px) - 28px);overflow:auto}
  .nav a{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:.82rem;
    text-decoration:none;color:var(--ink);background:#eef3f9;border:1px solid transparent}
  .nav a.ok{background:var(--ok-bg);color:var(--ok);border-color:#b8e4cf}
  .nav a.bad{background:var(--bad-bg);color:var(--bad);border-color:#f3c4c2}
  .nav a.cur{outline:2px solid var(--primary);outline-offset:1px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 12px;
    margin-bottom:14px;box-shadow:0 1px 3px rgba(40,70,110,.05);scroll-margin-top:calc(var(--barh,90px) + 14px)}
  .q h3{margin:0 0 12px;font-size:1.02rem;font-weight:600}
  .q h3 span{color:var(--primary)}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f8fafd;
    border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;color:var(--ink);transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
  .opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:#e3ebf6;display:grid;place-items:center;
    font-weight:600;font-size:.82rem;color:#456}
  .opt.correct{background:var(--ok-bg);border-color:var(--ok)}
  .opt.correct .k{background:var(--ok);color:#fff}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
  .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .fb{font-size:.88rem;margin:2px 0 6px;min-height:1px}
  .result{display:none;background:var(--card);border:2px solid var(--primary);border-radius:14px;
    padding:20px;text-align:center;margin-top:20px}
  .result h2{margin:0 0 6px;color:var(--primary)}
  .tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
  .tab{flex:1 1 0;min-width:96px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 10px;border-radius:10px;
    font-weight:600;font-size:.92rem;white-space:nowrap;transition:.15s}
  .tab small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
  .tab:hover{border-color:var(--primary);background:var(--primary-soft)}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .tab.active small{color:#e6efff}
  .tab.full:not(.active){border-color:#b8e4cf;background:var(--ok-bg);color:var(--ok)}
  body.weak{--primary:#d9822b;--primary-soft:#fff1de}
  body.weak header{background:linear-gradient(135deg,#d9822b,#f0a85a)}
  .topline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .modes{display:flex;gap:6px}
  .mode{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:99px;font-size:.88rem;font-weight:600}
  .mode:hover{border-color:var(--primary);background:var(--primary-soft)}
  .mode.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:99px;background:#fff1de;color:#b5661a;font-size:.78rem;text-align:center}
  .mode.active .badge{background:#fff;color:var(--primary)}
  .auto{font-size:.84rem;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
  .acts{display:flex;justify-content:flex-end;margin:0 0 6px}
  .star,.del{border:1px dashed #e0b27a;background:#fffaf2;color:#b5661a;padding:5px 12px;border-radius:8px;font-size:.84rem}
  .star:hover,.del:hover{background:#fff1de}
  .star.on{border-style:solid;background:#fff1de;font-weight:600}
  .del{border-color:#b8e4cf;background:var(--ok-bg);color:var(--ok)}
  .del:hover{background:#d3f0e1}
  .tag{color:var(--muted);font-weight:400}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:2rem;margin-bottom:6px}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding-bottom:24px}
  @media(max-width:860px){
    main{display:block}
    .nav{top:var(--barh,90px);z-index:9;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-height:none;
      border-radius:0 0 12px 12px;margin:0 0 14px;padding:8px 10px}
    .nav a{flex:none}
    .q{scroll-margin-top:calc(var(--barh,90px) + 60px)}
  }
  @media(max-width:520px){header h1{font-size:1.25rem}.q{padding:14px 12px 8px}}
</style>
</head>
<body>
<header>
  <h1>📘 Ôn tập trắc nghiệm</h1>
  <p id="sub"></p>
</header>

<div class="bar"><div class="bar-inner">
  <div class="topline">
    <div class="modes"><button class="mode" id="mode-quiz"></button><button class="mode" id="mode-weak"></button></div>
    <label class="auto"><input type="checkbox" id="auto"> Tự lưu câu làm sai</label>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="stats">
    <div>Đã làm: <b id="done">0</b>/<b id="total">0</b> &nbsp;·&nbsp;
      <span class="ok-t">Đúng: <b id="right">0</b></span> &nbsp;·&nbsp;
      <span class="bad-t">Sai: <b id="wrong">0</b></span></div>
    <div class="btns">
      <button class="btn" id="shuffle">🔀 Xáo trộn</button>
      <button class="btn main" id="reset">↺ Làm lại</button>
    </div>
  </div>
  <div class="progress"><div id="pbar"></div></div>
</div></div>

<main>
  <div class="nav" id="nav"></div>
  <div class="content"><div id="list"></div>
  <div class="result" id="result">
    <h2 id="rtitle"></h2>
    <p id="rtext"></p>
    <button class="btn main" onclick="resetQuiz(false)">Làm lại từ đầu</button>
  </div></div>
</main>
<footer>Chọn một đáp án để xem đúng/sai ngay lập tức · Bấm ☆ để lưu câu hay nhầm vào mục “Câu hay sai”.</footer>

i đa lượng kiến thức cho người học", "Tạo ra lợi nhuận kinh tế trực tiếp", "Đào tạo người học thi đỗ vào cấp học cao hơn", "Hình thành và phát triển toàn diện nhân cách cho người học"], "a": 3}, {"q": "Câu \"Nghề dạy học là một nghề sáng tạo bậc nhất vì nó sáng tạo ra những con người sáng tạo\" là của:", "o": ["Hồ Chí Minh", "Phạm Văn Đồng", "Lê Duẩn", "Cômenxki"], "a": 1}, {"q": "Đối tượng của hoạt động sư phạm là:", "o": ["Chương trình và sách giáo khoa", "Cơ sở vật chất của nhà trường", "Người học, thế hệ trẻ đang trong giai đoạn hình thành và phát triển nhân cách", "Đội ngũ giáo viên"], "a": 2}, {"q": "Công cụ quan trọng nhất, chủ yếu nhất của hoạt động sư phạm là:", "o": ["Nhân cách của người giáo viên", "Sách giáo khoa", "Thiết bị công nghệ dạy học", "Phòng học và đồ dùng dạy học"], "a": 0}, {"q": "Sản phẩm của hoạt động sư phạm là:", "o": ["Điểm số và thành tích của học sinh", "Giáo án và tài liệu giảng dạy", "Số lượng học sinh tốt nghiệp", "Nhân cách toàn diện của người học"], "a": 3}, {"q": "Việc đánh giá chất lượng và hiệu quả của hoạt động sư phạm khó khăn, lâu dài vì:", "o": ["Giáo viên không muốn bị đánh giá", "Sản phẩm của hoạt động sư phạm có tính chất đặc thù, không phải sản phẩm vật chất trực tiếp", "Chưa có quy định về đánh giá giáo viên", "Học sinh không hợp tác khi đánh giá"], "a": 1}, {"q": "Nhà sư phạm V. A. Xu-khôm-lin-xki cho rằng lao động của người giáo viên:", "o": ["Dễ đánh giá nhất trong các loại lao động", "Cho kết quả ngay sau một học kì", "Có sai lầm và thất bại dẫn đến hậu quả nặng nề như không lao động nào khác", "Không cần thời gian dài mới thấy kết quả"], "a": 2}, {"q": "Môi trường sư phạm là môi trường:", "o": ["Được chọn lựa, xây dựng có mục đích sư phạm, không chỉ ở trường học mà cả ở gia đình và cộng đồng", "Chỉ gồm phòng học và trang thiết bị", "Hoàn toàn tự nhiên, không có sự tác động của giáo viên", "Chỉ tồn tại trong nhà trường"], "a": 0}, {"q": "Hoạt động sư phạm là một dạng hoạt động có tính chất:", "o": ["Chỉ mang tính khoa học", "Chỉ mang tính nghệ thuật", "Chỉ mang tính kĩ thuật", "Vừa mang tính khoa học, vừa mang tính nghệ thuật cao"], "a": 3}, {"q": "Theo Điều 67 Luật Giáo dục 2019, nhà giáo phải có tiêu chuẩn nào sau đây?", "o": ["Có học vị tiến sĩ trở lên", "Có phẩm chất, tư tưởng, đạo đức tốt", "Có thâm niên công tác tối thiểu 10 năm", "Có kinh nghiệm quản lí giáo dục"], "a": 1}, {"q": "Phẩm chất nghề nghiệp của giáo viên phổ thông là:", "o": ["Khả năng thiết kế kế hoạch dạy học", "Khả năng nghiên cứu khoa học sư phạm", "Tư tưởng, đạo đức, lối sống của giáo viên trong thực hiện nhiệm vụ dạy học, giáo dục", "Khả năng sử dụng công nghệ thông tin"], "a": 2}, {"q": "Nhóm năng lực \"tìm hiểu và nắm vững đặc điểm học sinh\" bao gồm:", "o": ["Thu thập và xử lí thông tin về học sinh", "Thiết kế kế hoạch dạy học", "Lập đề cương nghiên cứu", "Phối hợp các lực lượng giáo dục"], "a": 0}, {"q": "Nhóm năng lực \"tổ chức dạy học và giáo dục\" bao gồm:", "o": ["Phát hiện vấn đề nghiên cứu", "Giao tiếp, tham vấn, tư vấn", "Phát triển kĩ năng sống", "Thiết kế kế hoạch, tổ chức hoạt động và đánh giá kết quả dạy học, giáo dục"], "a": 3}, {"q": "Nhóm năng lực \"nghiên cứu khoa học sư phạm ứng dụng\" bao gồm:", "o": ["Xử lí tình huống giáo dục", "Phát hiện vấn đề nghiên cứu; lập đề cương, kế hoạch; tổ chức nghiên cứu; trình bày, công bố kết quả", "Phối hợp giữa nhà trường và gia đình", "Tự học, tự bồi dưỡng chuyên môn"], "a": 1}, {"q": "Nhóm năng lực \"hoạt động xã hội\" của giáo viên bao gồm:", "o": ["Lập kế hoạch tìm hiểu học sinh", "Đánh giá kết quả học tập của học sinh", "Phối hợp các lực lượng giáo dục; giao tiếp, tham vấn, tư vấn; xử lí tình huống giáo dục", "Ứng dụng công nghệ thông tin trong dạy học"], "a": 2}, {"q": "Trình độ chuẩn được đào tạo của giáo viên tiểu học theo Điều lệ trường tiểu học (2020) là:", "o": ["Cử nhân ngành đào tạo giáo viên tiểu học hoặc cử nhân chuyên ngành phù hợp và chứng chỉ bồi dưỡng nghiệp vụ sư phạm giáo dục tiểu học", "Tốt nghiệp trung học phổ thông", "Thạc ], "a": 1}, {"q": "Ba mục tiêu nâng cao dân trí, đào tạo nhân lực, bồi dưỡng nhân tài có quan hệ:", "o": ["Đối lập nhau, nên phải ưu tiên một mục tiêu trong từng giai đoạn", "Độc lập nhau, mỗi mục tiêu thực hiện riêng ở từng bậc học", "Thay thế nhau, hoàn thành mục tiêu này thì chuyển sang mục tiêu khác", "Thống nhất biện chứng, tác động qua lại, cần thực hiện đồng thời"], "a": 3}, {"q": "Các phẩm chất chung chủ yếu của học sinh trong Chương trình giáo dục phổ thông 2018 gồm:", "o": ["Yêu nước, nhân ái, chăm chỉ, trung thực, trách nhiệm", "Tự chủ, giao tiếp, sáng tạo, hợp tác, giải quyết vấn đề", "Đạo đức, trí tuệ, thể chất, thẩm mĩ, lao động", "Yêu nước, nhân ái, chăm chỉ, kỉ luật, sáng tạo"], "a": 0}, {"q": "Các năng lực chung cốt lõi của học sinh trong Chương trình giáo dục phổ thông 2018 gồm:", "o": ["Yêu nước, nhân ái, chăm chỉ; trung thực, trách nhiệm", "Tự chủ và tự học; giao tiếp và hợp tác; giải quyết vấn đề và sáng tạo", "Tính toán, ngôn ngữ, thể chất, thẩm mĩ, tin học", "Tự chủ và tự học; giao tiếp và hợp tác; tính toán và ngôn ngữ"], "a": 1}, {"q": "Năng lực là thuộc tính cá nhân được hình thành, phát triển nhờ:", "o": ["Tố chất sẵn có, được bộc lộ tự nhiên theo độ tuổi", "Quá trình học tập, tích luỹ kiến thức ở nhà trường", "Tố chất sẵn có và quá trình học tập, rèn luyện", "Môi trường gia đình và sự định hướng của cha mẹ"], "a": 2}, {"q": "Kĩ năng sống là:", "o": ["Kĩ năng nghề nghiệp chuyên sâu giúp cá nhân lập nghiệp và thăng tiến", "Kĩ năng sử dụng máy móc, công nghệ trong học tập và sinh hoạt", "Kĩ năng làm bài, ghi nhớ và ứng phó với thi cử, kiểm tra", "Năng lực, hành vi thích ứng, tích cực giúp ứng xử hiệu quả trước thách thức của cuộc sống"], "a": 3}, {"q": "Theo Điều 28 Luật Giáo dục 2019, thời gian học và tuổi vào lớp đầu cấp lần lượt là:", "o": ["Tiểu học 5 năm (6 tuổi); THCS 4 năm (11 tuổi); THPT 3 năm (15 tuổi)", "Tiểu học 4 năm (6 tuổi); THCS 5 năm (11 tuổi); THPT 3 năm (15 tuổi)", "Tiểu học 5 năm (7 tuổi); THCS 4 năm (12 tuổi); THPT 3 năm p, tư thục và có vốn đầu tư nước ngoài", "Sự sắp xếp theo trình tự bậc, liên kết hữu cơ, đồng bộ các bậc học, cấp học, ngành học từ thấp đến cao", "Cơ cấu đội ngũ giáo viên, cán bộ quản lí theo từng bậc học và cấp học"], "a": 2}, {"q": "Yếu tố nào sau đây là yếu tố chủ quan tác động đến hệ thống giáo dục quốc dân?", "o": ["Chế độ chính trị – xã hội và chính sách giáo dục của quốc gia", "Mục đích, nội dung chương trình, phương thức giáo dục và quản lí giáo dục của hệ thống", "Trình độ phát triển kinh tế, khoa học kĩ thuật và công nghệ của quốc gia", "Truyền thống văn hoá, giáo dục và đặc điểm thời đại của mỗi quốc gia"], "a": 1}, {"q": "Yếu tố nào sau đây là yếu tố khách quan tác động đến hệ thống giáo dục quốc dân?", "o": ["Nội dung chương trình và phương thức tổ chức giáo dục", "Phương thức giáo dục và hình thức tổ chức dạy học", "Trình độ phát triển của giáo dục thế giới", "Quản lí giáo dục và mục đích giáo dục của hệ thống"], "a": 2}, {"q": "Khi xây dựng hoặc tái cấu trúc hệ thống giáo dục quốc dân cần đảm bảo nguyên tắc:", "o": ["Vừa tiếp cận trình độ giáo dục thế giới vừa phù hợp điều kiện quốc gia; đảm bảo thống nhất, đồng bộ, ổn định, liên thông, liên tục", "Tiếp cận trình độ giáo dục thế giới, ưu tiên áp dụng mô hình đã thành công ở các nước phát triển", "Phù hợp điều kiện kinh tế, xã hội, văn hoá của quốc gia; thống nhất, đồng bộ, ổn định, độc lập với thế giới", "Vừa tiếp cận giáo dục thế giới vừa phù hợp điều kiện quốc gia; ưu tiên giáo dục đại học làm trọng tâm"], "a": 0}, {"q": "Theo Điều 4 Luật Giáo dục 2019, giáo dục đại học đào tạo các trình độ:", "o": ["Trung cấp, cao đẳng, đại học, thạc sĩ", "Cao đẳng, đại học, thạc sĩ, tiến sĩ", "Đại học, thạc sĩ, tiến sĩ, sau tiến sĩ", "Sơ cấp, trung cấp, cao đẳng, đại học"], "a": 1}, {"q": "Nghị quyết 29-NQ/TW (2013) xác định quan điểm chỉ đạo đổi mới hệ thống giáo dục theo hướng:", "o": ["Mở, ổn định, phân tách rõ giữa các bậc học, trình độ và các phương thức giáo dục, đào tạo", "Chuẩn hoá, hiện đại hoá, ưu tiên phát triển giáo dục đại học và sau đại học", "Linh hoạt, thích ứng, tập trung đào tạo nghề và liên thông giáo dục nghề nghiệp với đại học", "Mở, linh hoạt, liên thông giữa các bậc học, trình độ và giữa các phương thức giáo dục, đào tạo"], "a": 3}, {"q": "Nghị quyết 29-NQ/TW đặt mục tiêu xây dựng nền giáo dục:", "o": ["Mở, thực học, thực nghiệp, dạy tốt, học tốt, đánh giá tốt", "Mở, thực học, thực nghiệp, dạy chữ, dạy người, định hướng nghề nghiệp", "Mở, thực học, thực nghiệp, dạy tốt, học tốt, quản lí tốt", "Mở, hiện đại, hội nhập, dạy tốt, học tốt, quản lí tốt"], "a": 2}, {"q": "Quyết định 1981/QĐ-TTg (2016) của Thủ tướng Chính phủ phê duyệt:", "o": ["Khung chương trình giáo dục phổ thông tổng thể", "Khung cơ cấu hệ thống giáo dục quốc dân Việt Nam", "Điều lệ trường tiểu học và trường trung học", "Quy chế đánh giá, xếp loại học sinh phổ thông"], "a": 1}, {"q": "Theo Sơ đồ 1 (khung cơ cấu hệ thống giáo dục quốc dân 2016), tuổi bắt đầu đi học ở tiểu học, trung học cơ sở, trung học phổ thông lần lượt là:", "o": ["6, 11, 16", "6, 12, 15", "7, 11, 15", "6, 11, 15"], "a": 3}, {"q": "Theo Sơ đồ 1, thời gian đào tạo trình độ tiến sĩ là:", "o": ["3–4 năm", "2–3 năm", "3–5 năm", "4–5 năm"], "a": 0}, {"q": "Giáo dục phổ thông bao gồm:", "o": ["Mầm non, tiểu học, trung học cơ sở", "Tiểu học, trung học cơ sở, trung học phổ thông", "Trung học cơ sở, trung học phổ thông, trung cấp", "Mẫu giáo, tiểu học, trung học cơ sở, trung học phổ thông"], "a": 1}, {"q": "Giáo dục phổ thông được xác định là:", "o": ["Nền tảng khoa học của đất nước, đơn vị trọng yếu của hệ thống giáo dục quốc dân, đặt nền móng cho đào tạo nhân lực chất lượng cao", "Nền tảng văn hoá của đất nước, bậc học bắt buộc, đặt nền móng cho giáo dục nghề nghiệp và đại học", "Nền tảng văn hoá của đất nước, đơn vị cơ sở của hệ thống giáo dục quốc dân, đặt nền móng ban đầu cho sự phát triển toàn diện nhân cách thế hệ trẻ", "Nền tảng kinh tế của đất nước, đơn vị cơ sở của hệ thống giáo dục quốc dân, tạo nguồn nhân lực cho sản xuất"], "a": 2}, {"q": "Theo Điều 27 Luật Giáo dục 2019, mục tiêu của giáo dục phổ thông là:", "o": ["Phát triển toàn diện về đạo đức, trí tuệ, thể chất, thẩm mĩ và kĩ năng cơ bản; hình thành nhân cách con người Việt Nam xã hội chủ nghĩa, tư cách và trách nhiệm công dân; chuẩn bị học lên hoặc đi vào cuộc sống lao động", "Phát triển toàn diện về đạo đức, trí tuệ, thể chất, thẩm mĩ và kĩ năng cơ bản; hình thành nhân cách con người Việt Nam; chuẩn bị chủ yếu cho học sinh thi vào đại học", "Phát triển năng lực cá nhân, tính năng động, sáng tạo; hình thành tư cách công dân; định hướng phân luồng học sinh vào giáo dục nghề nghiệp sau trung học cơ sở", "Trang bị học vấn phổ thông vững chắc về trí tuệ và thể chất; hình thành tư cách công dân; chuẩn bị tham gia lao động sản xuất sau khi tốt nghiệp"], "a": 0}, {"q": "Cấp học đầu tiên, là cơ sở, nền móng của giáo dục phổ thông là:", "o": ["Mầm non", "Trung học cơ sở", "Trung học phổ thông", "Tiểu học"], "a": 3}, {"q": "Giáo dục trung học cơ sở giúp học sinh có:", "o": ["Học vấn phổ thông ở trình độ cơ sở và kĩ năng nghề nghiệp để đi vào lao động ngay", "Học vấn phổ thông hoàn chỉnh và những hiểu biết thông thường về kĩ thuật, hướng nghiệp", "Học vấn phổ thông ở trình độ cơ sở và những hiểu biết ban đầu về kĩ thuật, hướng nghiệp", "Học vấn phổ thông nền tảng và kĩ năng nghiên cứu khoa học bước đầu"], "a": 2}, {"q": "Cấp học được coi là cấp học “bản lề”, có nhiệm vụ tạo nguồn quan trọng cho đào tạo nhân lực ở các trình độ cao hơn là:", "o": ["Trung học phổ thông", "Trung học cơ sở", "Tiểu học", "Giáo dục nghề nghiệp"], "a": 0}, {"q": "Nghị quyết số 88/2014/QH13 của Quốc hội là về:", "o": ["Đổi mới căn bản, toàn diện giáo dục và đào tạo", "Ban hành Chương trình giáo dục phổ thông tổng thể", "Đổi mới chương trình, sách giáo khoa giáo dục phổ thông", "Sửa đổi, bổ sung một số điều của Luật Giáo dục"], "a": 2}, {"q": "Mục tiêu của Nghị quyết 88/2014/QH13 là chuyển nền giáo dục:", "o": ["Từ nặng về truyền thụ kiến thức sang phát triển năng lực, chú trọng trí tuệ hơn đức, thể, mĩ", "Từ nặng về truyền thụ kiến thức sang phát triển toàn diện cả phẩm chất và năng lực, hài hoà đức, trí, thể, mĩ", "Từ giáo dục đại trà sang giáo dục tinh hoa, phát triển toàn diện phẩm chất và năng lực", "Từ nặng về lí thuyết sang phát triển kĩ năng nghề nghiệp, phân luồng sớm cho học sinh"], "a": 1}, {"q": "Chương trình giáo dục là:", "o": ["Danh mục sách giáo khoa, tài liệu tham khảo được sử dụng chính thức trong nhà trường theo từng cấp học", "Kế hoạch tổng thể về thời khoá biểu, phân công giảng dạy và thời gian năm học tại nhà trường", "Văn bản quy định mục tiêu, nội dung, quy chế thi cử và xếp loại học sinh ở từng cấp học", "Kế hoạch tổng thể về toàn bộ hoạt động giáo dục trong thời gian xác định, quy định mục đích, mục tiêu, chuẩn đầu ra, nội dung, phương thức tổ chức và đánh giá"], "a": 3}, {"q": "Theo Luật Giáo dục 2019, ai ban hành chương trình giáo dục phổ thông và duyệt sách giáo khoa?", "o": ["Thủ tướng Chính phủ, trên cơ sở đề nghị của Bộ trưởng Bộ Giáo dục và Đào tạo", "Quốc hội, trên cơ sở thẩm định của Uỷ ban Văn hoá, Giáo dục của Quốc hội", "Bộ trưởng Bộ Giáo dục và Đào tạo, trên cơ sở thẩm định của Hội đồng quốc gia thẩm định chương trình giáo dục phổ thông và sách giáo khoa", "Bộ trưởng Bộ Giáo dục và Đào tạo, trên cơ sở đề xuất của các Sở Giáo dục và Đào tạo"], "a": 2}, {"q": "Chương trình giáo dục phổ thông là:", "o": ["Văn bản hướng dẫn chuyên môn do Bộ trưởng ban hành, để các trường tham khảo khi xây dựng kế hoạch", "Văn bản quy phạm pháp luật do Bộ trưởng ban hành, làm căn cứ viết sách giáo khoa, tổ chức hoạt động giáo dục và đánh giá kết quả giáo dục", "Văn bản quy phạm pháp luật do Sở Giáo dục và Đào tạo ban hành, làm căn cứ tổ chức giáo dục tại địa phương", "Văn bản do từng trường xây dựng, làm căn cứ để viết sách giáo khoa và đánh giá học sinh"], "a": 1}, {"q": "Chương trình giáo dục phổ thông bao gồm:", "o": ["Chương trình tổng thể, các chương trình môn học và hoạt động giáo dục", "Chương trình tổng thể, sách giáo khoa và tài liệu hướng dẫn giáo viên", "Chương trình môn học, kế hoạch dạy học và chuẩn nghề nghiệp giáo viên", "Chương trình tiểu học, trung học cơ sở và chương trình giáo dục thường xuyên"], "a": 0}, {"q": "Chương trình giáo dục phổ thông tổng thể (theo Thông tư 14/2017/TT-BGDĐT) KHÔNG bao gồm:", "o": ["Quan điểm xây dựng chương trình và mục tiêu chương trình các cấp học", "Yêu cầu cần đạt về phẩm chất chủ yếu và năng lực cốt lõi của học sinh cuối mỗi cấp học", "Hệ thống môn học, hoạt động giáo dục và thời lượng của từng môn học", "Nội dung chi tiết, kế hoạch bài dạy cụ thể của từng tiết học do giáo viên soạn"], "a": 3}, {"q": "Chương trình môn học là văn bản:", "o": ["Ghi nhận kết quả học tập, rèn luyện của học sinh theo từng môn học trong năm", "Phân công giáo viên và quy định số tiết dạy của từng môn học ở mỗi lớp", "Xác định vị trí, vai trò môn học, mục tiêu, yêu cầu cần đạt, nội dung cốt lõi, định hướng kế hoạch dạy học, phương pháp và đánh giá của môn học", "Kế hoạch dạy học do giáo viên xây dựng dựa trên điều kiện của lớp và nhà trường"], "a": 2}, {"q": "Thông tư số 32/2018/TT-BGDĐT ban hành:", "o": ["Điều lệ trường tiểu học và trường trung học", "Chương trình giáo dục phổ thông (2018)", "Quy chế đánh giá, xếp loại học sinh phổ thông", "Chuẩn nghề nghiệp giáo viên cơ sở giáo dục phổ thông"], "a": 1}, {"q": "Kế hoạch giáo dục phổ thông trong Chương trình 2018 được chia thành hai giai đoạn:", "o": ["Giáo dục cơ bản (lớp 1–9) và giáo dục định hướng nghề nghiệp (lớp 10–12)", "Giáo dục cơ bản (lớp 1–5) và giáo dục định hướng nghề nghiệp (lớp 6–12)", "Giáo dục đại cương (lớp 1–9) và giáo dục chuyên sâu (lớp 10–12)", "Giáo dục cơ bản (lớp 1–8) và giáo dục định hướng nghề nghiệp (lớp 9–12)"], "a": 0}, {"q": "Thời gian thực học trong một năm học tương đương:", "o": ["30 tuần", "32 tuần", "35 tuần", "37 tuần"], "a": 2}, {"q": "Cơ sở giáo dục tổ chức dạy học 1 buổi/ngày hay 2 buổi/ngày đều phải:", "o": ["Cắt giảm nội dung chương trình cho phù hợp với thời lượng học của từng buổi", "Thực hiện nội dung giáo dục bắt buộc chung thống nhất đối với tất cả cơ sở giáo dục trong cả nước", "Tự xây dựng nội dung dạy học phù hợp với điều kiện của nhà trường và địa phương", "Ưu tiên dạy các môn học chính, các môn còn lại tổ chức theo nhu cầu của học sinh"], "a": 1}, {"q": "Hệ thống môn học và hoạt động giáo dục trong kế hoạch giáo dục phổ thông gồm:", "o": ["Các môn học và hoạt động giáo dục bắt buộc, các môn học tự chọn và chuyên đề học tập", "Các môn học bắt buộc, môn học lựa chọn theo định hướng nghề nghiệp và hoạt động ngoại khoá", "Các môn học và hoạt động giáo dục bắt buộc cùng nội dung giáo dục của địa phương", "Các môn học và hoạt động giáo dục bắt buộc, môn học lựa chọn theo định hướng nghề nghiệp và môn học tự chọn"], "a": 3}, {"q": "Người chịu trách nhiệm cao nhất tổ chức, quản lí các hoạt động và chất lượng giáo dục của nhà trường phổ thông là:", "o": ["Chủ tịch hội đồng trường", "Bí thư chi bộ nhà trường", "Hiệu trưởng", "Phó hiệu trưởng"], "a": 2}, {"q": "Hội đồng trường (công lập) hoặc Hội đồng quản trị (tư thục) là tổ chức:", "o": ["Chịu trách nhiệm quyết định phương hướng hoạt động của nhà trường, huy động và giám sát các nguồn lực, gắn nhà trường với cộng đồng, bảo đảm mục tiêu giáo dục", "Chịu trách nhiệm điều hành hoạt động giảng dạy, phân công chuyên môn và đánh giá chất lượng giáo viên", "Tư vấn cho hiệu trưởng về quản lí tài chính, tài sản và chế độ chính sách của nhà trường", "Xét thi đua, khen thưởng, kỉ luật đối với cán bộ, giáo viên và học sinh trong trường"], "a": 0}, {"q": "Tổng số thành viên của hội đồng trường trung học công lập là:", "o": ["7 đến 11 người", "9 đến 13 người", "11 đến 15 người", "9 đến 11 người"], "a": 1}, {"q": "Mỗi tổ chuyên môn có tổ trưởng và:", "o": ["2 đến 3 tổ phó, do hiệu trưởng bổ nhiệm", "1 đến 2 tổ phó, do giáo viên trong tổ bầu", "1 đến 2 tổ phó, do Hội đồng trường bổ nhiệm", "1 đến 2 tổ phó, do hiệu trưởng bổ nhiệm"], "a": 3}, {"q": "Tổ văn phòng gồm viên chức làm công tác:", "o": ["Văn thư, kế toán, thủ quỹ, y tế trường học và nhân viên khác", "Thư viện, thiết bị giáo dục, văn thư, kế toán và nhân viên khác", "Giảng dạy, tư vấn cho học sinh, thư viện và thiết bị giáo dục", "Văn thư, kế toán, thủ quỹ, tư vấn cho học sinh và giáo viên bộ môn"], "a": 0}, {"q": "Tổ văn phòng sinh hoạt định kì:", "o": ["Mỗi tuần một lần", "Hai tuần một lần", "Mỗi tháng một lần", "Mỗi quý một lần"], "a": 1}, {"q": "Hội đồng thi đua khen thưởng do ai thành lập và làm chủ tịch?", "o": ["Bí thư cấp uỷ Đảng", "Chủ tịch công đoàn", "Phó hiệu trưởng", "Hiệu trưởng nhà trường"], "a": 3}, {"q": "Hội đồng kỉ luật trong nhà trường phổ thông được thành lập để:", "o": ["Xét hoặc xoá kỉ luật đối với học sinh theo từng vụ việc", "Xét hoặc xoá kỉ luật đối với cán bộ, giáo viên theo từng vụ việc", "Xét thi đua, khen thưởng đối với học sinh theo từng học kì", "Tư vấn việc giải quyết các công việc chung của nhà trường theo yêu cầu"], "a": 0}, {"q": "Các tổ chức, đoàn thể trong nhà trường phổ thông (Công đoàn, Đoàn Thanh niên Cộng sản Hồ Chí Minh, Đội Thiếu niên Tiền phong Hồ Chí Minh...) hoạt động nhằm:", "o": ["Hỗ trợ hiệu trưởng điều hành và quyết định các hoạt động chuyên môn của nhà trường", "Giám sát việc quản lí tài chính và tài sản của nhà trường theo quy định", "Giúp nhà trường thực hiện mục tiêu, nguyên lí giáo dục theo quy định của pháp luật", "Phối hợp với các tổ chuyên môn xây dựng kế hoạch giáo dục của nhà trường"], "a": 2}, {"q": "Mỗi lớp học có không quá bao nhiêu học sinh ở tiểu học và trung học?", "o": ["30 ở tiểu học và 40 ở trung học", "40 ở tiểu học và 50 ở trung học", "35 ở tiểu học và 45 ở trung học", "35 ở tiểu học và 40 ở trung học"], "a": 2}, {"q": "Lớp trưởng và lớp phó do tập thể học sinh bầu ra:", "o": ["Vào đầu mỗi học kì; học sinh đảm nhận không quá 2 học kì trong một cấp học", "Vào đầu năm học; học sinh đảm nhận không quá 2 năm học trong một cấp học", "Vào đầu mỗi học kì; học sinh có thể đảm nhận liên tục trong cả cấp học", "Vào cuối năm học; học sinh đảm nhận không quá 2 học kì trong một cấp học"], "a": 0}, {"q": "Tổ chức học tập cơ sở ở trường phổ thông, nơi chủ yếu diễn ra các hoạt động học tập và rèn luyện nhân cách của học sinh là:", "o": ["Tổ học sinh", "Lớp học", "Câu lạc bộ", "Đội Cờ đỏ"], "a": 1}, {"q": "Đơn vị cơ sở của lớp, giúp học sinh học tập, rèn luyện theo yêu cầu chung của lớp là:", "o": ["Nhóm văn nghệ", "Câu lạc bộ", "Tổ học sinh", "Khối lớp"], "a": 2}, {"q": "Hoạt động giáo dục ở nhà trường phổ thông được hiểu là hoạt động:", "o": ["Tương tác một chiều từ hoạt động chủ đạo của nhà giáo dục đến hoạt động tiếp nhận của học sinh", "Tương tác, biện chứng, thống nhất giữa hoạt động chủ đạo của nhà giáo dục và hoạt động tự giác, tích cực, chủ động của học sinh", "Tương tác, biện chứng giữa hoạt động tự giáo dục của học sinh và tác động tự phát của môi trường xã hội", "Thống nhất giữa hoạt động dạy của giáo viên và hoạt động học của học sinh trong phạm vi lớp học"], "a": 1}, {"q": "Hoạt động chủ đạo của nhà giáo dục thể hiện ở:", "o": ["Định hướng, tổ chức và thực hiện thay học sinh những nhiệm vụ khó trong học tập, rèn luyện", "Truyền đạt hệ thống kiến thức, kĩ năng theo chương trình để học sinh ghi nhớ, vận dụng", "Định hướng, tổ chức, hướng dẫn, đánh giá và điều chỉnh quá trình học tập, rèn luyện nhân cách của học sinh", "Giám sát, kiểm tra, cho điểm và xếp loại kết quả học tập, rèn luyện của học sinh"], "a": 2}, {"q": "Trong hoạt động giáo dục, học sinh là:", "o": ["Đối tượng tác động sư phạm, tiếp nhận và thực hiện các yêu cầu giáo dục của nhà giáo dục", "Chủ thể học tập, tự quyết định nội dung, mục tiêu và phương pháp giáo dục cho mình", "Người tiếp nhận hệ thống kinh nghiệm xã hội do nhà giáo dục chuyển giao", "Vừa là đối tượng tác động sư phạm của nhà giáo dục vừa là chủ thể học tập, tự giáo dục"], "a": 3}, {"q": "Bản chất chung của giáo dục là:", "o": ["Quá trình hình thành bản chất người, quá trình xã hội hoá con người", "Quá trình truyền đạt kinh nghiệm xã hội từ thế hệ trước sang thế hệ sau theo một chiều", "Quá trình hình thành tri thức khoa học và kĩ năng nghề nghiệp cho con người", "Quá trình phát triển thể chất và tâm lí của con người theo quy luật tự nhiên"], "a": 0}, {"q": "Hoạt động giáo dục phải chuyển hoá được:", "o": ["Nhu cầu chủ quan của học sinh thành các yêu cầu khách quan của xã hội", "Các yêu cầu khách quan của xã hội thành nhu cầu chủ quan của học sinh", "Kết quả học tập của học sinh thành điểm số và xếp loại theo quy chế", "Nội dung chương trình thành thời lượng và kế hoạch dạy học của nhà trường"], "a": 1}, {"q": "Thước đo giá trị đích thực của một người (nhân cách) là:", "o": ["Mức độ nhận thức, hiểu biết về các chuẩn mực xã hội", "Mức độ vững vàng của tình cảm và niềm tin", "Mức độ đúng đắn của hành vi, năng lực", "Số lượng kiến thức và bằng cấp đạt được"], "a": 2}, {"q": "Sự thống nhất biện chứng phản ánh bản chất của hoạt động giáo dục là sự thống nhất giữa:", "o": ["Tác động của giáo viên và tác động của nhà trường đối với học sinh", "Nội dung và hình thức tổ chức hoạt động giáo dục trong nhà trường", "Lí luận và thực tiễn trong tổ chức hoạt động giáo dục ở nhà trường", "Tác động sư phạm của nhà giáo dục (nhà trường – gia đình – xã hội) và hoạt động tự giác, tích cực, chủ động của học sinh"], "a": 3}, {"q": "Đặc điểm nào sau đây KHÔNG phải là đặc điểm của hoạt động giáo dục học sinh?", "o": ["Tính mục đích", "Tính phức hợp, lâu dài và liên tục", "Tính cá biệt", "Tính đồng loạt, áp dụng như nhau cho mọi học sinh"], "a": 3}, {"q": "Mục đích giáo dục (trong đặc điểm tính mục đích) là:", "o": ["Mô hình nhân cách cần hình thành cho học sinh, thể hiện yêu cầu cần đạt về phẩm chất, năng lực phù hợp mỗi giai đoạn phát triển theo từng cấp học", "Hệ thống tri thức, kĩ năng cần trang bị cho học sinh, thể hiện qua các môn học ở từng cấp học", "Kết quả dự kiến sau mỗi bài học, thể hiện yêu cầu về biết, hiểu, vận dụng của học sinh", "Quy định về chuẩn đầu ra và điểm số tối thiểu mà học sinh phải đạt ở mỗi cấp học"], "a": 0}, {"q": "“Lực nhiễu” trong tính phức hợp của hoạt động giáo dục là:", "o": ["Các tác động tích cực, thống nhất từ nhà trường, gia đình, xã hội làm tăng hiệu quả hoạt động giáo dục", "Các tác động tiêu cực, tự phát, mâu thuẫn từ nhà trường, gia đình, xã hội gây khó khăn, thậm chí “vô hiệu hoá” tác động có mục đích của nhà giáo dục", "Sự can thiệp quá mức của phụ huynh vào hoạt động giáo dục của nhà trường đối với học sinh", "Sự thiếu phối hợp giữa các tổ chức Đoàn, Đội với giáo viên trong hoạt động giáo dục"], "a": 1}, {"q": "Sự hình thành và phát triển nhân cách là quá trình:", "o": ["Diễn ra chủ yếu ở tuổi đi học, kết thúc khi học sinh tốt nghiệp phổ thông", "Diễn ra chủ yếu trong nhà trường, dưới sự tổ chức của nhà giáo dục", "Lâu dài, từ khi con người chào đời cho đến cuối đời", "Ngắn hạn, hoàn thành khi con người đến tuổi trưởng thành"], "a": 2}, {"q": "Quá trình giáo dục lại là quá trình:", "o": ["Thuận lợi hơn giáo dục ban đầu, vì học sinh đã có sẵn nền tảng nhận thức và hành vi", "Khó khăn, chủ yếu dựa vào biện pháp xử phạt nghiêm khắc để uốn nắn hành vi sai lệch", "Khó khăn, chủ yếu dựa vào nhắc nhở thường xuyên và sự giám sát của gia đình", "Khó khăn, vừa xoá bỏ cái cũ vừa hình thành cái mới phù hợp hơn, phải lựa chọn phương pháp đặc thù, thích hợp"], "a": 3}, {"q": "Do tính cá biệt, nhà giáo dục cần:", "o": ["Có những tác động riêng phù hợp với từng đối tượng trong từng tình huống cụ thể, tránh giáo dục rập khuôn, máy móc, hình thức", "Áp dụng thống nhất một cách giáo dục đã được kiểm chứng hiệu quả cho mọi học sinh trong lớp", "Tập trung tác động vào nhóm học sinh có kết quả nổi trội để tạo sức lan toả cho tập thể", "Dựa chủ yếu vào đặc điểm chung của lứa tuổi để lựa chọn nội dung và phương pháp phù hợp"], "a": 0}, {"q": "Hoạt động dạy học có chức năng trội là:", "o": ["Tổ chức, hướng dẫn học sinh lĩnh hội hệ thống giá trị, chuẩn mực xã hội, rèn luyện kĩ năng sống", "Tổ chức, hướng dẫn học sinh lĩnh hội hệ thống tri thức khoa học, rèn luyện kĩ năng, kĩ xảo, phát triển năng lực chuyên môn đặc thù trong các môn học", "Tổ chức, hướng dẫn học sinh rèn luyện năng lực tâm lí – xã hội thông qua trải nghiệm thực tiễn", "Tổ chức phong trào thi đua, khen thưởng và đánh giá phẩm chất của học sinh"], "a": 1}, {"q": "Hoạt động trải nghiệm, hướng nghiệp cùng các hoạt động giáo dục khác có chức năng trội là:", "o": ["Tổ chức, hướng dẫn học sinh lĩnh hội hệ thống tri thức khoa học, rèn luyện kĩ năng, kĩ xảo trong các môn học", "Tổ chức, hướng dẫn học sinh tự kiểm tra, đánh giá và điều chỉnh quá trình học tập của mình", "Tổ chức, hướng dẫn học sinh lĩnh hội hệ thống giá trị, chuẩn mực xã hội, rèn luyện kĩ năng sống, phát triển năng lực tâm lí – xã hội", "Tổ chức, hướng dẫn học sinh quản lí lớp học, điều hành các hoạt động tập thể và thi đua"], "a": 2}, {"q": "Hoạt động giáo dục tổng thể gồm các hoạt động bộ phận:", "o": ["Hoạt động dạy học; hoạt động giáo dục, trải nghiệm trong nhà trường; hoạt động tự giáo dục của học sinh", "Hoạt động dạy học; hoạt động ngoại khoá; hoạt động quản lí của nhà trường", "Hoạt động dạy học; hoạt động giáo dục, trải nghiệm; hoạt động xã hội, cộng đồng", "Hoạt động giáo dục của nhà trường; hoạt động giáo dục của gia đình; hoạt động giáo dục của xã hội"], "a": 0}, {"q": "Nguyên tắc giáo dục là:", "o": ["Những quy định có tính bắt buộc về nội dung, hình thức, xử phạt và khen thưởng trong nhà trường", "Những cách thức hoạt động phối hợp giữa nhà giáo dục và học sinh để thực hiện nhiệm vụ giáo dục", "Những cách tổ chức, sắp xếp hoạt động giáo dục theo trật tự và chế độ nhất định", "Những luận điểm có tính quy luật, định hướng việc lựa chọn, vận dụng nội dung, phương thức tổ chức giáo dục, đảm bảo thực hiện nhiệm vụ theo mục tiêu xác định"], "a": 3}, {"q": "Nguyên tắc nào sau đây KHÔNG nằm trong hệ thống nguyên tắc hoạt động giáo dục ở trường phổ thông?", "o": ["Đảm bảo tính mục đích của hoạt động giáo dục", "Đảm bảo tính trực quan, sinh động trong hoạt động giáo dục", "Đảm bảo giáo dục trong tập thể và bằng tập thể", "Đảm bảo tính hệ thống, tính liên tục trong hoạt động giáo dục"], "a": 1}, {"q": "Việc xác định mục đích, mục tiêu giáo dục phải đảm bảo “sợi chỉ đỏ” xuyên suốt, nghĩa là:", "o": ["Nhất quán xuyên suốt các cấp độ mục tiêu, đồng thời linh hoạt với từng đối tượng học sinh và hoàn cảnh cụ thể", "Thống nhất mục tiêu ở mọi cấp độ và áp dụng như nhau cho mọi đối tượng học sinh", "Linh hoạt theo từng đối tượng học sinh và hoàn cảnh, mỗi cấp độ mục tiêu được xác định độc lập", "Xác định mục tiêu cấp học làm chuẩn, các hoạt động cụ thể không cần xác định riêng mục tiêu"], "a": 0}, {"q": "Theo nguyên tắc đảm bảo hoạt động giáo dục gắn với thực tiễn đời sống, hoạt động giáo dục:", "o": ["Diễn ra chủ yếu trong nhà trường, hoạt động ngoài nhà trường chỉ mang tính bổ trợ khi có điều kiện", "Gắn với thực tiễn thông qua sách vở, tài liệu và các bài học minh hoạ trong lớp học", "Gắn với thực tiễn thông qua kiểm tra, thi cử bằng các tình huống thực tế trong cuộc sống", "Không bó hẹp trong nhà trường mà phải mở rộng phạm vi các hoạt động giáo dục ngoài nhà trường"], "a": 3}, {"q": "Trong phối hợp ba lực lượng giáo dục, vai trò chủ đạo thuộc về:", "o": ["Nhà trường; gia đình và xã hội giữ vai trò chủ động phối hợp", "Gia đình; nhà trường và xã hội giữ vai trò chủ động phối hợp", "Xã hội; nhà trường và gia đình giữ vai trò chủ động phối hợp", "Các phương tiện truyền thông; nhà trường và gia đình giữ vai trò hỗ trợ"], "a": 0}, {"q": "Theo nguyên tắc giáo dục trong tập thể và bằng tập thể, tập thể là:", "o": ["Môi trường tập hợp học sinh để tổ chức các hoạt động giáo dục của nhà trường", "Vừa là môi trường, vừa là phương tiện giáo dục hiệu quả nhất đối với học sinh", "Phương tiện kiểm tra, đánh giá kết quả học tập và rèn luyện của học sinh", "Môi trường tổ chức vui chơi, giao lưu và các sinh hoạt ngoài giờ lên lớp"], "a": 1}, {"q": "Khi xây dựng tập thể học sinh, cần:", "o": ["Đặt lợi ích tập thể lên trước, các nguyện vọng cá nhân được xem xét khi có điều kiện", "Tôn trọng lợi ích cá nhân của từng thành viên, lợi ích chung được hình thành tự phát", "Kết hợp hài hoà lợi ích cá nhân và lợi ích tập thể, tránh cực đoan hoá hoặc đối lập hai loại lợi ích", "Đảm bảo lợi ích của đa số thành viên, nguyện vọng của thiểu số được điều chỉnh theo tập thể"], "a": 2}, {"q": "Nhân cách chỉ có thể hình thành và phát triển thông qua:", "o": ["Hoạt động và bằng hoạt động của cá nhân với các tổ chức và cá nhân khác trong xã hội", "Quá trình tự học, tự nghiên cứu và tích luỹ tri thức của cá nhân dưới sự hướng dẫn của giáo viên", "Quá trình tiếp nhận hệ thống tri thức, chuẩn mực do nhà trường truyền thụ có hệ thống", "Sự tác động của di truyền và môi trường sống trong những năm đầu đời"], "a": 0}, {"q": "Theo nguyên tắc tôn trọng nhân cách kết hợp yêu cầu hợp lí đối với học sinh:", "o": ["Càng tôn trọng nhân cách học sinh bao nhiêu, càng nên giảm bớt yêu cầu đối với họ bấy nhiêu", "Càng tôn trọng nhân cách học sinh bao nhiêu, càng phải đưa ra những yêu cầu hợp lí đối với họ bấy nhiêu", "Tôn trọng nhân cách và đề ra yêu cầu hợp lí là hai việc cần thực hiện ở hai giai đoạn riêng", "Càng đề ra yêu cầu cao đối với học sinh thì mức độ tôn trọng nhân cách càng giảm"], "a": 1}, {"q": "Yêu cầu hợp lí đối với học sinh là yêu cầu:", "o": ["Ở mức vừa phải để mọi học sinh đều dễ dàng đạt được và không bị áp lực", "Ở mức cao nhất mà học sinh có thể đạt được để kích thích sự phấn đấu", "Đáp ứng mục tiêu giáo dục; vừa sức; kích thích học sinh tự giác, tích cực; khả thi; có khả năng mang lại hiệu quả mong muốn", "Do giáo viên và phụ huynh thống nhất đề ra dựa trên nguyện vọng của gia đình"], "a": 2}, {"q": "Trong hoạt động giáo dục, nhà giáo dục cần tránh:", "o": ["Nghiêm khắc, kiên quyết với những nhược điểm, sai lầm của học sinh", "Kịp thời động viên, kích thích học sinh phấn đấu vươn lên", "Đề ra yêu cầu ngày càng cao đối với học sinh một cách chân thành", "Thô bạo, khắt khe, thiếu tin tưởng, đồng thời dễ dãi, nuông chiều quá mức đối với học sinh"], "a": 3}, {"q": "Để thực hiện nguyên tắc phù hợp đặc điểm lứa tuổi và đặc điểm cá nhân, nhà giáo dục cần đảm bảo phối hợp giữa:", "o": ["Tính vừa sức chung và tính vừa sức riêng, giữa tính đại trà và tính cá biệt", "Tính khoa học và tính nghệ thuật, giữa tính đại trà và tính hệ thống", "Tính vừa sức chung và tính liên tục, giữa lí thuyết và thực hành", "Tính mục đích và tính thực tiễn, giữa tính cá biệt và tính tập thể"], "a": 0}, {"q": "Nguyên tắc đảm bảo tính hệ thống, tính liên tục đòi hỏi kế hoạch giáo dục thống nhất, nâng dần yêu cầu về phẩm chất và năng lực theo:", "o": ["Đường thẳng đi lên, mỗi cấp học là một giai đoạn tách biệt", "Vòng xoáy ốc – đồng tâm", "Vòng tròn khép kín, nội dung lặp lại ở mỗi cấp học", "Hình tháp, nội dung thu hẹp dần từ khái quát đến chuyên sâu"], "a": 1}, {"q": "Hoạt động giáo dục ở nhà trường phổ thông là một hệ thống gồm các thành tố:", "o": ["Giáo viên và học sinh; nội dung giáo dục; phương pháp giáo dục; kết quả giáo dục", "Mục tiêu; nội dung; chương trình; sách giáo khoa; hình thức tổ chức; đánh giá", "Chủ thể và đối tượng giáo dục; mục tiêu; nội dung; hình thức, phương pháp, phương tiện; môi trường, điều kiện giáo dục; kết quả giáo dục", "Chủ thể và đối tượng; mục tiêu; nội dung; phương pháp; chương trình; môi trường nhà trường"], "a": 2}, {"q": "Mục tiêu Chương trình giáo dục phổ thông 2018 được xác định theo định hướng:", "o": ["Phát triển phẩm chất, năng lực của học sinh", "Truyền thụ hệ thống kiến thức, kĩ năng cho học sinh", "Chuẩn bị cho học sinh các kì thi chuyển cấp", "Phân luồng, đào tạo nghề sớm cho học sinh"], "a": 0}, {"q": "Mục tiêu chương trình cấp tiểu học định hướng chính vào:", "o": ["Giáo dục về hướng nghiệp, phân luồng và những hiểu biết ban đầu về các ngành nghề", "Giáo dục về giá trị bản thân, gia đình, cộng đồng và những thói quen, nền nếp cần thiết trong học tập và sinh hoạt", "Giáo dục chuyên sâu theo sở trường, năng khiếu và nguyện vọng của từng học sinh", "Giáo dục về giá trị xã hội, cộng đồng và kĩ năng nghiên cứu khoa học ban đầu"], "a": 1}, {"q": "Mục tiêu chương trình cấp trung học cơ sở giúp học sinh:", "o": ["Củng cố kiến thức tiểu học, tự điều chỉnh theo chuẩn mực chung, chuẩn bị học nghề ngay sau trung học cơ sở", "Phát triển phẩm chất, năng lực, có hiểu biết thông thường về kĩ thuật và hướng nghiệp, chọn hướng phát triển", "Phát triển phẩm chất, năng lực đã hình thành ở tiểu học, tự điều chỉnh theo chuẩn mực chung, có hiểu biết ban đầu về ngành nghề và ý thức hướng nghiệp", "Hình thành năng lực chuyên sâu theo sở trường, có ý thức hướng nghiệp và chọn ngành nghề tương lai"], "a": 2}, {"q": "Mục tiêu chương trình cấp trung học phổ thông giúp học sinh:", "o": ["Hoàn thiện học vấn phổ thông, chuẩn bị tốt cho kì thi tốt nghiệp và tuyển sinh đại học", "Hình thành phẩm chất, năng lực nền tảng, có hiểu biết ban đầu về ngành nghề và ý thức hướng nghiệp", "Phát triển năng lực chuyên sâu theo sở trường, rèn luyện thể chất và kĩ năng nghề nghiệp cơ bản", "Tiếp tục phát triển phẩm chất, năng lực cần thiết với người lao động, ý thức công dân, khả năng tự học, học tập suốt đời, lựa chọn nghề nghiệp, thích ứng với toàn cầu hoá và cách mạng công nghiệp mới"], "a": 3}, {"q": "Theo Bảng 3.1, năng lực chung (được hình thành, phát triển thông qua tất cả các môn học và hoạt động giáo dục) gồm:", "o": ["Năng lực tự chủ và tự học; giao tiếp và hợp tác; giải quyết vấn đề và sáng tạo", "Năng lực ngôn ngữ, tính toán, khoa học, công nghệ, tin học", "Năng lực tự chủ và tự học; giao tiếp và hợp tác; tính toán và ngôn ngữ", "Năng lực giao tiếp và hợp tác; giải quyết vấn đề và sáng tạo; thẩm mĩ và thể chất"], "a": 0}, {"q": "Theo Bảng 3.1, năng lực đặc thù gồm:", "o": ["Tự chủ và tự học, giao tiếp và hợp tác, ngôn ngữ, tính toán, khoa học", "Ngôn ngữ, tính toán, khoa học, công nghệ, tin học, thẩm mĩ, thể chất", "Ngôn ngữ, tính toán, khoa học, công nghệ, tin học, thẩm mĩ, sáng tạo", "Ngôn ngữ, tính toán, khoa học, tự học, tin học, thẩm mĩ, thể chất"], "a": 1}, {"q": "Mục tiêu bài học, chủ đề giáo dụ
