, "o": ["1015 và 29", "997 và 28,5", "1032 và 29,5", "980 và 28"], "a": 1}, {"q": "Theo Bảng 3.2, số tiết trung bình/tuần ở tiểu học từ lớp 1 đến lớp 5 (không kể môn tự chọn) lần lượt là:", "o": ["25; 28; 30; 30; 30", "25; 25; 25; 28; 30", "25; 25; 28; 28; 30", "25; 25; 28; 30; 30"], "a": 3}, {"q": "Hình thức tổ chức giáo dục là:", "o": ["Cách tổ chức, sắp xếp hoạt động giáo dục theo một trật tự và chế độ nhất định nhằm thực hiện tốt các nhiệm vụ giáo dục", "Cách thức đánh giá kết quả học tập, rèn luyện của học sinh theo yêu cầu cần đạt của chương trình", "Hệ thống tri thức, kĩ năng được chọn lọc để tổ chức hoạt động giáo dục trong nhà trường", "Kết quả dự kiến học sinh đạt được sau mỗi hoạt động giáo dục theo mục tiêu đã xác định"], "a": 0}, {"q": "Phương pháp giáo dục là:", "o": ["Cách thức hoạt động của nhà giáo dục nhằm truyền đạt nội dung và thực hiện nhiệm vụ giáo dục", "Cách thức hoạt động phối hợp thống nhất của nhà giáo dục và người được giáo dục, tiến hành dưới vai trò chủ đạo của nhà giáo dục nhằm thực hiện nhiệm vụ và mục tiêu giáo dục", "Cách thức hoạt động phối hợp thống nhất của nhà giáo dục và người được giáo dục, tiến hành dưới vai trò chủ thể của người học", "Cách tổ chức, sắp xếp hoạt động giáo dục theo trật tự và chế độ nhất định nhằm thực hiện nhiệm vụ giáo dục"], "a": 1}, {"q": "Chương trình giáo dục phổ thông 2018 định hướng phương pháp giáo dục là:", "o": ["Giáo viên truyền thụ, học sinh ghi nhớ và vận dụng kiến thức qua hệ thống bài tập chuẩn", "Ưu tiên thuyết trình, giảng giải kết hợp đàm thoại để truyền đạt hệ thống tri thức", "Áp dụng các phương pháp tích cực hoá hoạt động của học sinh, giáo viên tổ chức, hướng dẫn hoạt động, tạo môi trường học tập thân thiện và tình huống có vấn đề", "Ứng dụng công nghệ thông tin và hệ thống tự động hoá kĩ thuật số làm phương pháp chủ đạo"], "a": 2}, {"q": "Các hoạt động học tập của học sinh theo định hướng Chương trình 2018 bao gồm:", "o": ["Hoạt động ghi nhớ, hoạt động luyện tập và hoạt động kiểm tra", "Hoạt động nghe giảng, hoạt động luyện tập và hoạt động thực hành", "Hoạt động khám phá vấn đề, hoạt động thi đua và hoạt động khen thưởng", "Hoạt động khám phá vấn đề, hoạt động luyện tập và hoạt động thực hành"], "a": 3}, {"q": "Các phương pháp giáo dục ở trường phổ thông được phân thành ba nhóm:", "o": ["Nhóm sử dụng ngôn ngữ; nhóm khám phá, thực hành, trải nghiệm; nhóm kích thích và điều chỉnh hoạt động của học sinh", "Nhóm sử dụng ngôn ngữ; nhóm quan sát, thực nghiệm; nhóm kích thích và điều chỉnh hoạt động của học sinh", "Nhóm sử dụng ngôn ngữ; nhóm khám phá, thực hành, trải nghiệm; nhóm kiểm tra và đánh giá kết quả học tập", "Nhóm trực quan; nhóm khám phá, thực hành, trải nghiệm; nhóm kích thích và điều chỉnh hoạt động của học sinh"], "a": 0}, {"q": "Mục đích cơ bản của nhóm phương pháp sử dụng ngôn ngữ là:", "o": ["Rèn luyện kĩ năng, kĩ xảo thông qua việc tổ chức học sinh thực hiện hành động thực tiễn", "Tác động trực tiếp đến nhận thức và tình cảm học sinh thông qua phân tích, so sánh, dẫn chứng, kết luận một vấn đề khoa học hay chuẩn mực giáo dục", "Kích thích khuynh hướng tự khẳng định và thúc đẩy học sinh cố gắng vươn lên trong tập thể", "Tổ chức học sinh khám phá, giải quyết vấn đề thực tiễn thông qua các nhiệm vụ học tập phức hợp"], "a": 1}, {"q": "Phương pháp thuyết trình – giảng giải là cách thức nhà giáo dục:", "o": ["Tổ chức cho học sinh tự lực tìm tòi, khám phá và giải quyết vấn đề học tập", "Tổ chức các nhóm nhỏ hợp tác nghiên cứu, trao đổi ý tưởng và giải quyết nhiệm vụ", "Dùng lời nói để trình bày, giải thích, chứng minh nội dung tri thức khoa học, giá trị, chuẩn mực xã hội đã quy định", "Dùng hệ thống câu hỏi trao đổi với học sinh để hình thành, củng cố nhận thức và niềm tin"], "a": 2}, {"q": "Trong phương pháp đàm thoại, nhà giáo dục đóng vai trò:", "o": ["Người quan sát, để học sinh tự trao đổi và tự rút ra kết luận cuối cùng", "Người đặt câu hỏi và trực tiếp trả lời, học sinh lắng nghe và ghi nhận", "Người điều phối, ghi nhận ý kiến của học sinh mà không đánh giá, kết luận", "Cố vấn, trọng tài khoa học định hướng học sinh suy nghĩ, phân tích, đánh giá tình huống và rút ra kết luận cuối cùng"], "a": 3}, {"q": "Nhóm phương pháp khám phá, thực hành, trải nghiệm gồm các phương pháp cụ thể:", "o": ["Giải quyết vấn đề; thực hành; hợp tác trong nhóm; tổ chức dự án", "Thuyết trình – giảng giải; đàm thoại; hợp tác trong nhóm; tổ chức dự án", "Giải quyết vấn đề; thực hành; thi đua; khen thưởng", "Giải quyết vấn đề; đàm thoại; thực hành; tổ chức dự án"], "a": 0}, {"q": "Trong phương pháp giải quyết vấn đề, “mâu thuẫn nhận thức” là mâu thuẫn giữa:", "o": ["Yêu cầu của giáo viên và khả năng thực hiện của học sinh khi giải quyết nhiệm vụ", "Những “cái đã biết” và những “cái chưa biết”, khiến học sinh muốn tìm tòi để giải quyết", "Lí thuyết đã học và thực hành, khiến học sinh muốn kiểm chứng điều đã biết", "Ý kiến của cá nhân và ý kiến của tập thể, khiến học sinh muốn thống nhất cách giải quyết"], "a": 1}, {"q": "Các bước của phương pháp giải quyết vấn đề theo thứ tự là:", "o": ["Nhận biết vấn đề – Tổ chức giải quyết – Lập kế hoạch giải quyết – Kiểm tra, đánh giá và kết luận", "Lập kế hoạch giải quyết – Nhận biết vấn đề – Tổ chức giải quyết – Kiểm tra, đánh giá và kết luận", "Nhận biết vấn đề – Lập kế hoạch giải quyết – Tổ chức giải quyết – Kiểm tra, đánh giá và kết luận", "Nhận biết vấn đề – Lập kế hoạch giải quyết – Kiểm tra, đánh giá – Tổ chức giải quyết và kết luận"], "a": 2}, {"q": "Phương pháp thực hành là cách thức tổ chức cho học sinh thực hiện các hành động, hoạt động thực hành, thực tiễn nhằm:", "o": ["Củng cố, hệ thống hoá tri thức lí thuyết đã lĩnh hội và ghi nhớ lâu dài", "Kiểm tra mức độ nắm vững kiến thức của học sinh sau mỗi bài học", "Kích thích tinh thần thi đua và khuynh hướng tự khẳng định của học sinh", "Hình thành, rèn luyện kĩ năng, kĩ xảo, phát triển năng lực vận dụng"], "a": 3}, {"q": "Đặc điểm cơ bản của phương pháp hợp tác trong nhóm là:", "o": ["Học sinh trong nhóm có trách nhiệm cá nhân và sự phụ thuộc, tương tác, hợp tác tích cực để giải quyết nhiệm vụ chung; thành công cá nhân góp phần tạo nên thành công của nhóm", "Học sinh trong nhóm có trách nhiệm cá nhân, tương tác tích cực; thành công của cá nhân quyết định thành công của nhóm", "Nhóm có số lượng thành viên linh hoạt, cố định suốt năm học để gắn bó và phát huy thế mạnh", "Học sinh có trình độ cao đóng vai trò chủ đạo, các thành viên còn lại hỗ trợ thực hiện nhiệm vụ"], "a": 0}, {"q": "Tiến trình phương pháp hợp tác trong nhóm gồm các bước:", "o": ["Tổ chức nhóm học tập – Tổ chức trình bày kết quả – Tổ chức đánh giá và kết luận của giáo viên", "Tổ chức nhóm học tập – Tổ chức hoạt động hợp tác trong nhóm – Tổ chức trình bày và đánh giá kết quả", "Nhận biết nhiệm vụ – Lập kế hoạch hợp tác – Thực hiện nhiệm vụ – Kiểm tra, đánh giá", "Chuẩn bị nhóm – Hợp tác thực hiện nhiệm vụ – Báo cáo và đánh giá kết quả dự án"], "a": 1}, {"q": "Các đặc điểm của phương pháp tổ chức dự án gồm:", "o": ["Định hướng thực tiễn, định hướng nội dung, định hướng sản phẩm", "Định hướng lí thuyết, định hướng học sinh, định hướng sản phẩm", "Định hướng thực tiễn, định hướng học sinh, định hướng sản phẩm", "Định hướng thực tiễn, định hướng học sinh, định hướng đánh giá"], "a": 2}, {"q": "Phương pháp tổ chức dự án tiến hành theo ba giai đoạn:", "o": ["Đề xuất ý tưởng – Thực hiện dự án – Báo cáo và đánh giá dự án", "Chuẩn bị dự án – Thực hiện dự án – Tổng kết và khen thưởng dự án", "Chuẩn bị dự án – Triển khai theo nhóm – Báo cáo và đánh giá dự án", "Chuẩn bị dự án – Thực hiện dự án – Báo cáo và đánh giá dự án"], "a": 3}, {"q": "Sản phẩm tạo ra ở giai đoạn chuẩn bị dự án (bước lập kế hoạch) là:", "o": ["Bản kế hoạch dự án", "Bản đề cương nội dung dự án", "Bản phân công nhiệm vụ của các nhóm", "Sản phẩm vật chất của dự án"], "a": 0}, {"q": "Trong phương pháp tổ chức dự án, nhà giáo dục chủ yếu đóng vai trò:", "o": ["Chỉ đạo, trực tiếp thực hiện các nhiệm vụ khó trong dự án", "Tư vấn, hướng dẫn, giúp đỡ học sinh trong quá trình thực hiện dự án", "Đánh giá, kiểm soát chặt chẽ từng bước thực hiện của học sinh", "Quyết định đề tài, nội dung và kế hoạch thực hiện dự án của nhóm"], "a": 1}, {"q": "Nhóm phương pháp kích thích và điều chỉnh hoạt động của học sinh gồm:", "o": ["Thuyết trình, đàm thoại, khen thưởng", "Giải quyết vấn đề, thi đua, trách phạt", "Thi đua, khen thưởng, trách phạt", "Thi đua, thực hành, khen thưởng"], "a": 2}, {"q": "Phương pháp thi đua nhằm:", "o": ["Kích thích khuynh hướng tự khẳng định của học sinh, thúc đẩy cố gắng của cá nhân; cần quan tâm hai giai đoạn: phát động và tổng kết", "Khẳng định, biểu dương thành tích của học sinh, củng cố niềm tin; cần quan tâm ba giai đoạn: phát động, tiến hành, tổng kết", "Biểu thị sự phê phán hành vi sai trái của học sinh, thúc đẩy vươn lên; cần quan tâm đủ ba giai đoạn", "Kích thích khuynh hướng tự khẳng định, thúc đẩy cố gắng cho cá nhân và tập thể; cần quan tâm đủ ba giai đoạn: phát động, tiến hành, tổng kết đánh giá"], "a": 3}, {"q": "Khi sử dụng phương pháp khen thưởng, nhà giáo dục cần đảm bảo:", "o": ["Dựa trên quá trình tiến bộ, hành vi thực tế; chú ý cả động cơ và phương thức đạt kết quả; công bằng, khách quan, kịp thời", "Dựa trên kết quả cuối cùng đạt được, chú ý mức độ đúng mực, công bằng và kịp thời", "Dựa trên thành tích nổi trội, chú ý động cơ và hình thức khen thưởng đa dạng", "Dựa trên quá trình tiến bộ của học sinh, ưu tiên các học sinh có thành tích xuất sắc"], "a": 0}, {"q": "Trách phạt là phương pháp giáo dục biểu thị:", "o": ["Sự đồng tình, ủng hộ những hành động, hành vi đúng đắn của học sinh so với yêu cầu đề ra", "Sự không đồng tình, phản đối, phê phán những hành động, hành vi sai trái của học sinh so với yêu cầu, mục tiêu đề ra", "Sự không hài lòng với kết quả học tập, rèn luyện của học sinh so với năng lực vốn có", "Sự răn đe, ngăn chặn những hành vi sai trái của học sinh bằng biện pháp xử phạt nghiêm khắc"], "a": 1}, {"q": "Không nên trách phạt thường xuyên vì:", "o": ["Làm học sinh mất tự tin và ngại tham gia hoạt động tập thể", "Làm giảm uy tín của nhà giáo dục trong mắt học sinh và phụ huynh", "Gây nên sức ì tâm lí ở học sinh và do đó không đạt hiệu quả giáo dục", "Làm mất thời gian dành cho hoạt động dạy học và giáo dục khác"], "a": 2}, {"q": "Cơ sở khoa học để lựa chọn và vận dụng các phương pháp giáo dục gồm:", "o": ["Mục tiêu, nội dung giáo dục; đặc điểm phương pháp; đặc điểm lứa tuổi và cá nhân học sinh; trình độ, năng lực, kinh nghiệm của nhà giáo dục; môi trường, tình huống, điều kiện cụ thể", "Mục tiêu, nội dung giáo dục; đặc điểm phương pháp; đặc điểm lứa tuổi và cá nhân học sinh; điều kiện cơ sở vật chất, thiết bị của nhà trường", "Mục tiêu giáo dục; đặc điểm phương pháp; trình độ, năng lực, kinh nghiệm của nhà giáo dục; sở thích của học sinh", "Mục tiêu, nội dung giáo dục; đặc điểm lứa tuổi và cá nhân học sinh; kết quả học tập của học sinh trong từng giai đoạn"], "a": 0}, {"q": "Đánh giá kết quả giáo dục học sinh phổ thông được hiểu là:", "o": ["Quá trình thu thập, xử lí thông tin qua kiểm tra, cho điểm bài làm, tổng hợp kết quả để xếp loại học sinh cuối kì", "Quá trình thu thập, xử lí thông tin qua quan sát, theo dõi, trao đổi, kiểm tra, nhận xét quá trình học tập, rèn luyện; tư vấn, hướng dẫn, động viên học sinh; diễn giải thông tin định tính hoặc định lượng về kết quả", "Quá trình so sánh kết quả học tập, rèn luyện của học sinh với chuẩn kiến thức, kĩ năng để xếp loại cuối năm học", "Quá trình theo dõi, nhận xét kết quả học tập của học sinh, đối chiếu giữa các học sinh để xác định thứ hạng"], "a": 1}, {"q": "Mục tiêu đánh giá kết quả giáo dục là:", "o": ["Xếp hạng học sinh theo kết quả học tập, rèn luyện để phục vụ thi đua, khen thưởng", "Phát hiện học sinh yếu kém để tổ chức dạy học phụ đạo theo yêu cầu của nhà trường", "Cung cấp thông tin chính xác, kịp thời, có giá trị về mức độ đáp ứng yêu cầu cần đạt và sự tiến bộ của học sinh để hướng dẫn học tập, điều chỉnh dạy học, quản lí và phát triển chương trình", "Cung cấp thông tin phục vụ tuyển sinh, thi tuyển và xét tốt nghiệp các cấp học"], "a": 2}, {"q": "Căn cứ đánh giá kết quả giáo dục học sinh phổ thông là:", "o": ["Chuẩn kiến thức, kĩ năng của từng môn học do tổ chuyên môn xây dựng hằng năm", "Kết quả các bài kiểm tra định kì do nhà trường tổ chức trong từng học kì", "Nhận xét của giáo viên chủ nhiệm và ý kiến của cha mẹ học sinh về sự tiến bộ", "Các yêu cầu cần đạt về phẩm chất, năng lực quy định trong chương trình tổng thể và các chương trình môn học, hoạt động giáo dục"], "a": 3}, {"q": "Nội dung đánh giá kết quả giáo dục học sinh gồm:", "o": ["Đánh giá quá trình học tập, sự tiến bộ và kết quả học tập theo yêu cầu cần đạt của môn học; đánh giá sự hình thành, phát triển phẩm chất, năng lực", "Đánh giá quá trình học tập, kết quả học tập theo yêu cầu cần đạt của môn học; đánh giá hạnh kiểm và kết quả rèn luyện thể chất", "Đánh giá kết quả học tập các môn học bắt buộc, môn học lựa chọn; đánh giá sự hình thành phẩm chất chủ yếu", "Đánh giá mức độ nắm vững kiến thức, kĩ năng của môn học; đánh giá năng lực chung và năng lực đặc thù"], "a": 0}, {"q": "Đánh giá kết quả giáo dục được thực hiện bằng:", "o": ["Hình thức đánh giá định lượng, thông qua đánh giá thường xuyên và định kì, bằng điểm số đối với tất cả các môn học", "Hình thức đánh giá định tính và định lượng, thông qua đánh giá thường xuyên và định kì, kết hợp nhận xét và điểm số đối với các môn học", "Hình thức đánh giá định tính, thông qua đánh giá thường xuyên, bằng nhận xét đối với các môn học và hoạt động giáo dục", "Hình thức đánh giá định tính và định lượng, thông qua đánh giá định kì cuối học kì và cuối năm học, bằng điểm số"], "a": 1}, {"q": "Đánh giá thường xuyên do ai tổ chức, trong đó đánh giá của ai là quan trọng nhất?", "o": ["Hiệu trưởng; đánh giá của hiệu trưởng", "Giáo viên phụ trách môn học; đánh giá của cha mẹ học sinh", "Giáo viên phụ trách môn học; đánh giá của giáo viên", "Cơ sở giáo dục; đánh giá của giáo viên chủ nhiệm"], "a": 2}, {"q": "Đánh giá định kì do ai tổ chức và nhằm mục đích gì?", "o": ["Giáo viên phụ trách môn học; phục vụ hướng dẫn học tập và điều chỉnh dạy học", "Sở Giáo dục và Đào tạo; phục vụ quản lí chất lượng giáo dục của địa phương", "Cơ sở giáo dục; phục vụ việc xếp loại, xét lên lớp và xét tốt nghiệp cho học sinh", "Cơ sở giáo dục; phục vụ công tác quản lí hoạt động dạy học, bảo đảm chất lượng và phát triển chương trình"], "a": 3}, {"q": "Quy chế đánh giá, xếp loại học sinh tiểu học và học sinh trung học được quy định lần lượt tại:", "o": ["Thông tư 27/2021/TT-BGDĐT và Thông tư 22/2022/TT-BGDĐT", "Thông tư 22/2022/TT-BGDĐT và Thông tư 27/2021/TT-BGDĐT", "Thông tư 14/2017/TT-BGDĐT và Thông tư 32/2018/TT-BGDĐT", "Thông tư 32/2018/TT-BGDĐT và Thông tư 22/2022/TT-BGDĐT"], "a": 0}, {"q": "Công cụ đánh giá thường xuyên theo tiếp cận năng lực KHÔNG bao gồm:", "o": ["Phiếu quan sát, bảng kiểm tra", "Bài thi trắc nghiệm tập trung một lần vào cuối học kì và cuối năm", "Nhật kí ghi chép, hỏi – đáp nhanh", "Sản phẩm học sinh, dự án học tập, hồ sơ học tập"], "a": 1}, {"q": "Các điều kiện tổ chức hoạt động giáo dục gồm:", "o": ["Tổ chức và quản lí nhà trường; đội ngũ cán bộ quản lí, giáo viên, nhân viên; nguồn lực kinh phí, cơ sở vật chất, thiết bị dạy học; xã hội hoá giáo dục", "Tổ chức và quản lí nhà trường; đội ngũ giáo viên; nguồn lực kinh phí; môi trường giáo dục gia đình", "Đội ngũ cán bộ quản lí, giáo viên, nhân viên; cơ sở vật chất, thiết bị; chương trình, sách giáo khoa", "Tổ chức và quản lí nhà trường; cơ sở vật chất, thiết bị; xã hội hoá giáo dục; chính sách tuyển sinh"], "a": 0}, {"q": "Về đội ngũ giáo viên, yêu cầu của chương trình là:", "o": ["100% giáo viên có trình độ đào tạo trên chuẩn, xếp loại khá trở lên theo Chuẩn nghề nghiệp", "100% giáo viên có trình độ đào tạo đạt chuẩn hoặc trên chuẩn, xếp loại đạt trở lên theo Chuẩn nghề nghiệp giáo viên cơ sở giáo dục phổ thông", "70% giáo viên có trình độ đào tạo trên chuẩn, xếp loại đạt trở lên theo Chuẩn nghề nghiệp", "100% giáo viên đạt chuẩn trình độ đào tạo, tỉ lệ xếp loại theo Chuẩn do địa phương quy định"], "a": 1}, {"q": "Xã hội hoá giáo dục dựa trên quan điểm:", "o": ["Giáo dục là sự nghiệp của Nhà nước và của ngành giáo dục", "Giáo dục là trách nhiệm của nhà trường, gia đình và các tổ chức đoàn thể", "Giáo dục là sự nghiệp của Đảng, của Nhà nước và của toàn dân", "Giáo dục là sự nghiệp của Đảng và của đội ngũ nhà giáo trong cả nước"], "a": 2}, {"q": "Tình huống giáo dục (tình huống sư phạm) là:", "o": ["Mọi sự việc, hiện tượng diễn ra trong lớp học và trong quan hệ giữa giáo viên với học sinh", "Những vi phạm nội quy, kỉ luật của học sinh đòi hỏi nhà giáo dục xử lí kịp thời", "Những sự cố an toàn, bất thường xảy ra trong nhà trường đòi hỏi giải quyết khẩn cấp", "Toàn bộ sự việc, hiện tượng, sự kiện, hoàn cảnh có vấn đề nảy sinh trong hoạt động và quan hệ giáo dục, đòi hỏi nhà giáo dục tìm cách giải quyết tối ưu để đạt mục đích giáo dục"], "a": 3}, {"q": "Kĩ năng giải quyết tình huống giáo dục là:", "o": ["Khả năng vận dụng tri thức khoa học, kinh nghiệm giáo dục để giải quyết một cách tối ưu những tình huống nảy sinh trong hoạt động và quan hệ giáo dục", "Khả năng vận dụng quy chế, nội quy của nhà trường để xử lí vi phạm của học sinh kịp thời", "Khả năng trình bày, thuyết phục học sinh nhận thức đúng đắn về các chuẩn mực xã hội", "Khả năng tổ chức, điều hành lớp học và phối hợp với phụ huynh để duy trì kỉ luật"], "a": 0}, {"q": "Bước 1 của quy trình giải quyết tình huống giáo dục là:", "o": ["Biểu đạt vấn đề cần giải quyết trong tình huống", "Phân tích dữ kiện đã cho trong tình huống và xác định dữ kiện quan trọng, chủ yếu", "Nêu giả thuyết về các phương án giải quyết và chọn phương án tối ưu", "Chứng minh giả thuyết bằng tri thức khoa học và kinh nghiệm giáo dục"], "a": 1}, {"q": "Bước 2 của quy trình giải quyết tình huống giáo dục là:", "o": ["Chứng minh giả thuyết bằng tri thức khoa học và kinh nghiệm giáo dục", "Phân tích dữ kiện đã cho và xác định dữ kiện quan trọng, chủ yếu", "Biểu đạt vấn đề cần giải quyết trong tình huống đã cho", "Rút ra kết luận sư phạm và bài học kinh nghiệm cho bản thân"], "a": 2}, {"q": "Bước 3 của quy trình giải quyết tình huống giáo dục là:", "o": ["Biểu đạt vấn đề cần giải quyết trong tình huống đã cho", "Rút ra kết luận sư phạm và bài học kinh nghiệm cho bản thân", "Phân tích dữ kiện đã cho và xác định dữ kiện quan trọng, chủ yếu", "Nêu giả thuyết về các phương án giải quyết và lựa chọn phương án tối ưu"], "a": 3}, {"q": "Bước 4 của quy trình giải quyết tình huống giáo dục là:", "o": ["Chứng minh giả thuyết: vận dụng tri thức tâm lí học, giáo dục học và kinh nghiệm để lí giải cơ sở khoa học của phương án tối ưu", "Nêu giả thuyết: đưa ra các phương án giải quyết có thể có và lựa chọn phương án tối ưu", "Phân tích dữ kiện: xác định đối tượng, chủ thể, hoàn cảnh và các mối liên hệ trong tình huống", "Biểu đạt vấn đề: chỉ ra vấn đề đã giải quyết đến đâu và cần tiếp tục giải quyết ra sao"], "a": 0}, {"q": "Bước 5 (bước cuối) của quy trình giải quyết tình huống giáo dục là:", "o": ["Chứng minh giả thuyết, lí giải cơ sở khoa học của phương án giải quyết tối ưu nhất", "Rút ra kết luận sư phạm, bài học kinh nghiệm cho bản thân trong công tác giáo dục học sinh", "Biểu đạt vấn đề cần giải quyết, chỉ ra việc cần tiếp tục giải quyết cho thoả đáng", "Phân tích dữ kiện, xác định đối tượng, chủ thể và hoàn cảnh diễn ra tình huống"], "a": 1}, {"q": "Thứ tự đúng của quy trình giải quyết tình huống giáo dục là:", "o": ["Biểu đạt vấn đề – Phân tích dữ kiện – Nêu giả thuyết và chọn phương án – Chứng minh giả thuyết – Kết luận sư phạm", "Phân tích dữ kiện – Biểu đạt vấn đề – Chứng minh giả thuyết – Nêu giả thuyết – Rút ra kết luận sư phạm", "Phân tích dữ kiện – Biểu đạt vấn đề – Nêu giả thuyết và chọn phương án tối ưu – Chứng minh giả thuyết – Rút ra kết luận sư phạm", "Phân tích dữ kiện – Nêu giả thuyết – Biểu đạt vấn đề – Chứng minh giả thuyết – Rút ra kết luận sư phạm"], "a": 2}], "4": [{"q": "Giáo viên chủ nhiệm lớp ở trường phổ thông là:", "o": ["Giáo viên có thâm niên, uy tín và kinh nghiệm quản lí được Sở Giáo dục và Đào tạo chỉ định phụ trách một lớp", "Giáo viên có năng lực, uy tín và kinh nghiệm giáo dục được tổ chuyên môn đề cử để quản lí, giáo dục một lớp", "Giáo viên có năng lực, uy tín và kinh nghiệm giáo dục được hiệu trưởng lựa chọn để quản lí, giáo dục một lớp", "Giáo viên có uy tín được tập thể học sinh bầu chọn và được hiệu trưởng công nhận để phụ trách một lớp"], "a": 2}, {"q": "Giáo viên chủ nhiệm là người thay mặt ai để quản lí, giáo dục toàn diện học sinh một lớp?", "o": ["Phó hiệu trưởng phụ trách chuyên môn", "Hiệu trưởng nhà trường", "Tổng phụ trách Đội và Bí thư Đoàn trường", "Hội đồng trường"], "a": 1}, {"q": "Nội dung nào sau đây KHÔNG phải là chức năng của giáo viên chủ nhiệm lớp?", "o": ["Quản lí – giáo dục toàn diện học sinh một lớp học", "Cố vấn cho hoạt động tự quản của tập thể học sinh", "Làm cầu nối giữa tập thể học sinh với các lực lượng giáo dục trong nhà trường", "Thay mặt tập thể lớp quyết định kế hoạch giáo dục chung của toàn trường"], "a": 3}, {"q": "Giáo viên chủ nhiệm chịu trách nhiệm về công tác quản lí học sinh trước:", "o": ["Phòng Giáo dục và Đào tạo", "Hiệu trưởng nhà trường", "Ban đại diện cha mẹ học sinh", "Tổ trưởng chuyên môn"], "a": 1}, {"q": "Để thực hiện chức năng quản lí – giáo dục toàn diện học sinh, giáo viên chủ nhiệm phải:", "o": ["Xây dựng kế hoạch phát triển tập thể, tổ chức các hoạt động giáo dục, kiểm tra kết quả học tập các môn văn hoá của học sinh", "Xây dựng kế hoạch phát triển tập thể, tổ chức các hoạt động giáo dục, tự mình thực hiện thay học sinh các công việc của lớp", "Xây dựng kế hoạch, tổ chức hoạt động, đánh giá kết quả học tập và rèn luyện của học sinh mà không cần đánh giá sự phát triển của tập thể", "Xây dựng kế hoạch phát triển tập thể; tổ chức, chỉ đạo các hoạt động; kiểm tra, đánh giá kết quả học tập, rèn luyện của học sinh và sự phát triển của tập thể"], "a": 3}, {"q": "Mối quan hệ giữa quản lí và giáo dục trong công tác chủ nhiệm là:", "o": ["Bổ sung cho nhau nhưng được tiến hành độc lập ở hai giai đoạn khác nhau", "Thống nhất biện chứng, được tiến hành đồng thời trong toàn bộ quá trình chủ nhiệm", "Thống nhất với nhau nhưng giáo dục luôn phải đi trước quản lí", "Tách rời tương đối, quản lí trước rồi mới tiến hành giáo dục"], "a": 1}, {"q": "Chức năng đặc trưng của giáo viên chủ nhiệm là:", "o": ["Quản lí – giáo dục toàn diện học sinh một lớp học", "Đại diện nhà trường truyền đạt kế hoạch giáo dục đến học sinh", "Cố vấn cho hoạt động tự quản của tập thể học sinh", "Tổ chức phối hợp các lực lượng giáo dục ngoài nhà trường"], "a": 2}, {"q": "Với tư cách là cố vấn cho hoạt động tự quản, giáo viên chủ nhiệm:", "o": ["Định hướng, hướng dẫn, hỗ trợ, tư vấn để học sinh tự làm; không làm thay, cũng không “khoán trắng” hay thả lỏng", "Định hướng, hướng dẫn và trực tiếp điều hành công việc của lớp để bảo đảm tiến độ, nhưng không làm thay từng em", "Giao toàn quyền cho cán bộ lớp tự quyết định, chỉ can thiệp khi lớp xảy ra vi phạm nghiêm trọng", "Trực tiếp tổ chức hoạt động của lớp, học sinh tham gia thực hiện theo kế hoạch đã được giáo viên xây dựng"], "a": 0}, {"q": "Điều kiện quan trọng để giáo viên chủ nhiệm thực hiện tốt chức năng cố vấn là:", "o": ["Có nhiều năm kinh nghiệm giảng dạy và được học sinh yêu mến, tin tưởng", "Có sự giám sát thường xuyên của ban đại diện cha mẹ học sinh và tổ chức Đoàn, Đội", "Được nhà trường bảo đảm đủ cơ sở vật chất và thời gian để tổ chức hoạt động", "Xây dựng được đội ngũ cán bộ lớp có năng lực, bồi dưỡng phần tử tích cực và phát huy sức mạnh tự quản của tập thể"], "a": 3}, {"q": "Để thực hiện chức năng cố vấn, giáo viên chủ nhiệm cần:", "o": ["Hiểu lí luận tập thể, có kĩ năng bồi dưỡng đội ngũ tự quản, dự báo chính xác khả năng học sinh, luôn yêu cầu cao về tính tự quản, chủ động", "Hiểu lí luận tập thể, nắm vững kiến thức bộ môn, có kĩ năng bồi dưỡng đội ngũ tự quản và trực tiếp điều hành mọi hoạt động của lớp", "Hiểu vai trò của tập thể, có kĩ năng quản lí hành chính, biết lập sổ sách để theo dõi và kiểm soát chặt chẽ từng học sinh", "Có uy tín cá nhân, nắm vững kiến thức bộ môn, biết giao việc và luôn kiểm tra trực tiếp mọi việc của cán bộ lớp"], "a": 0}, {"q": "Chức năng “cầu nối” giữa tập thể học sinh với các lực lượng giáo dục trong nhà trường thể hiện ở hai vai trò:", "o": ["Đại diện cho hiệu trưởng và đại diện cho Sở Giáo dục", "Đại diện cho cha mẹ học sinh và đại diện cho học sinh", "Đại diện cho nhà trường và đại diện cho giáo viên bộ môn", "Đại diện cho nhà trường và đại diện cho học sinh, tập thể học sinh"], "a": 3}, {"q": "Với tư cách là người đại diện cho nhà trường, giáo viên chủ nhiệm cần:", "o": ["Truyền đạt yêu cầu của nhà trường, thuyết phục lớp thực hiện đầy đủ và đặt chỉ tiêu cao để lớp đạt thành tích tốt", "Truyền đạt chủ trương, kế hoạch của nhà trường nhưng để lớp tự chọn giải pháp, không cần gợi ý hay hướng dẫn", "Truyền đạt chủ trương, yêu cầu, kế hoạch của nhà trường; gợi ý giải pháp vừa đảm bảo yêu cầu chung vừa phù hợp khả năng của lớp, tránh gây áp lực và chạy theo thành tích", "Truyền đạt kế hoạch của nhà trường và báo cáo kết quả thực hiện, việc lựa chọn giải pháp thuộc về nhà trường"], "a": 2}, {"q": "Với tư cách là người đại diện cho học sinh và tập thể học sinh, giáo viên chủ nhiệm có trách nhiệm:", "o": ["Thay mặt học sinh đưa ra quyết định về các vấn đề của lớp sau khi đã lắng nghe ý kiến của các em", "Lắng nghe, tập hợp ý kiến, nguyện vọng của học sinh để phản ánh với ban giám hiệu; bảo vệ quyền lợi chính đáng của học sinh", "Lắng nghe ý kiến của học sinh, chọn lọc những ý kiến phù hợp với chủ trương nhà trường để phản ánh với ban giám hiệu", "Chỉ phản ánh với ban giám hiệu những ý kiến của cán bộ lớp và bảo vệ quyền lợi chung của cả tập thể lớp"], "a": 1}, {"q": "Để làm tốt chức năng “cầu nối”, giáo viên chủ nhiệm cần:", "o": ["Có trách nhiệm cao, năng lực thuyết phục, khả năng thiết lập quan hệ tốt với các lực lượng giáo dục, biết giữ gìn uy tín, có ý chí vượt khó", "Có trách nhiệm cao, say sưa với nghề, chuyên môn giỏi và chấp hành nghiêm mệnh lệnh của cấp trên", "Có trách nhiệm cao, biết tránh va chạm với các lực lượng giáo dục để giữ gìn uy tín và sự hoà thuận", "Có năng lực thuyết phục, chuyên môn vững vàng, kiên trì áp dụng nhất quán phương pháp của bản thân"], "a": 0}, {"q": "Việc phối hợp các lực lượng giáo dục ngoài nhà trường (gia đình, đoàn thể xã hội, cộng đồng dân cư...) là:", "o": ["Một nguyên tắc quản lí nhà trường, thuộc trách nhiệm riêng của hiệu trưởng", "Một biện pháp bổ trợ, chỉ cần thiết với những học sinh cá biệt", "Một nguyên tắc giáo dục, đồng thời là một trong những nội dung thực hiện xã hội hoá giáo dục", "Một nội dung xã hội hoá giáo dục, thực hiện tuỳ theo điều kiện của từng lớp"], "a": 2}, {"q": "Hình thức phối hợp của giáo viên chủ nhiệm với cha mẹ học sinh KHÔNG bao gồm:", "o": ["Hội nghị cha mẹ học sinh định kì", "Phiếu liên lạc, tiếp xúc riêng", "Họp ban đại diện cha mẹ học sinh để thay giáo viên đánh giá học sinh", "Trao đổi thông tin qua phương tiện liên lạc, công nghệ"], "a": 2}, {"q": "Đối với ban đại diện cha mẹ học sinh lớp, giáo viên chủ nhiệm:", "o": ["Phối hợp khi cần huy động kinh phí, không định hướng nội dung hoạt động", "Giao toàn quyền điều hành để ban đại diện chủ động trong mọi hoạt động", "Chỉ làm việc với ban đại diện khi học sinh có vi phạm", "Phát huy vai trò và định hướng cho ban đại diện hoạt động"], "a": 3}, {"q": "Theo Điều lệ trường tiểu học (2020), nhiệm vụ của giáo viên chủ nhiệm KHÔNG bao gồm:", "o": ["Chủ động nắm bắt thông tin từng học sinh của lớp được phân công chủ nhiệm", "Tự phê duyệt kế hoạch hoạt động giáo dục của lớp mình chủ nhiệm trước khi thực hiện", "Phối hợp chặt chẽ với cha mẹ học sinh, giáo viên, tổng phụ trách Đội, các tổ chức xã hội có liên quan", "Báo cáo thường kì hoặc đột xuất về tình hình của lớp với hiệu trưởng"], "a": 1}, {"q": "Theo Điều lệ trường tiểu học, giáo viên chủ nhiệm thực hiện các hoạt động giáo dục theo kế hoạch đã xây dựng và:", "o": ["Được hiệu trưởng phê duyệt", "Được Phòng Giáo dục và Đào tạo phê duyệt", "Được tổ chuyên môn thông qua", "Được Hội đồng trường phê duyệt"], "a": 0}, {"q": "Theo Điều lệ trường tiểu học, giáo viên chủ nhiệm tổng hợp nhận xét, đánh giá học sinh vào thời điểm:", "o": ["Giữa kì I và cuối năm học", "Cuối kì I và cuối năm học", "Cuối mỗi tháng và cuối năm học", "Đầu năm học và cuối kì II"], "a": 1}, {"q": "Theo Điều lệ trường tiểu học, giáo viên chủ nhiệm báo cáo thường kì hoặc đột xuất về tình hình của lớp với:", "o": ["Phòng Giáo dục và Đào tạo", "Tổng phụ trách Đội", "Hiệu trưởng", "Ban đại diện cha mẹ học sinh"], "a": 2}, {"q": "Theo Điều lệ trường THCS và THPT (2020), giáo viên chủ nhiệm phối hợp với:", "o": ["Đội Thiếu niên Tiền phong Hồ Chí Minh, Đoàn Thanh niên Cộng sản Hồ Chí Minh, Hội Liên hiệp Thanh niên Việt Nam, gia đình học sinh và các tổ chức xã hội liên quan", "Đội Thiếu niên Tiền phong Hồ Chí Minh, Đoàn Thanh niên Cộng sản Hồ Chí Minh, gia đình học sinh và các tổ chức xã hội liên quan", "Đoàn Thanh niên Cộng sản Hồ Chí Minh, Hội Liên hiệp Thanh niên Việt Nam, Hội Liên hiệp Phụ nữ và gia đình học sinh", "Đội Thiếu niên Tiền phong Hồ Chí Minh, Hội Liên hiệp Thanh niên Việt Nam, gia đình học sinh và chính quyền địa phương"], "a": 0}, {"q": "Theo Điều lệ trường THCS và THPT (2020), giáo viên chủ nhiệm còn có nhiệm vụ:", "o": ["Tham gia công tác phổ cập giáo dục trung học phổ thông ở địa phương; học tập, rèn luyện nâng cao trình độ chuyên môn", "Tham gia công tác tuyển sinh đầu cấp ở địa phương; học tập, rèn luyện nâng cao trình độ chuyên môn", "Tham gia công tác phổ cập giáo dục trung học cơ sở ở địa phương; học tập, rèn luyện nâng cao trình độ, đổi mới phương pháp dạy học, giáo dục", "Tham gia quản lí tài chính, tài sản của nhà trường; học tập, rèn luyện nâng cao trình độ chuyên môn"], "a": 2}, {"q": "Việc tìm hiểu và nắm vững đối tượng giáo dục là:", "o": ["Vừa là nội dung, vừa là điều kiện để làm tốt công tác giáo dục", "Chỉ là điều kiện để làm tốt công tác giáo dục, không phải nội dung của công tác chủ nhiệm", "Nội dung công việc chủ yếu của giai đoạn đầu năm học, sau đó chỉ bổ sung khi cần", "Công việc của giáo viên bộ môn, giáo viên chủ nhiệm chỉ tham khảo kết quả"], "a": 0}, {"q": "Nội dung nào thuộc việc tìm hiểu tập thể học sinh?", "o": ["Đặc điểm tâm sinh lí, năng lực, sở thích và nguyện vọng của từng học sinh trong lớp", "Trình độ phát triển, truyền thống, bầu không khí, sở thích, năng khiếu và nguyện vọng của từng học sinh", "Trình độ phát triển, truyền thống, bầu không khí, các mối quan hệ, nhóm tự phát, thủ lĩnh tự phát, mặt mạnh, mặt yếu", "Hoàn cảnh sống, sức khoẻ, tính cách của từng học sinh và mối quan hệ với gia đình"], "a": 2}, {"q": "Nội dung nào thuộc việc tìm hiểu cá nhân học sinh?", "o": ["Đặc điểm tâm sinh lí, tính cách, năng lực, sở thích, truyền thống và bầu không khí của lớp", "Đặc điểm tâm sinh lí, tính cách, năng lực, sở thích, hoàn cảnh sống, quan hệ với tập thể, bè bạn", "Đặc điểm tâm sinh lí, hoàn cảnh sống, sự phân hoá nhóm tự phát và thủ lĩnh tự phát", "Tính cách, năng lực, sở thích, trình độ phát triển và mặt mạnh, mặt yếu của tập thể"], "a": 1}, {"q": "Cách thức tìm hiểu học sinh KHÔNG bao gồm:", "o": ["Nghiên cứu hồ sơ học sinh (lí lịch, học bạ, sổ liên lạc)", "Trao đổi với học sinh, bạn bè, giáo viên bộ môn, cha mẹ học sinh", "Suy đoán dựa trên hạnh kiểm năm học trước mà không đối chiếu thêm nguồn thông tin khác", "Nghiên cứu sản phẩm hoạt động của học sinh như bài làm, báo tường, nhật kí"], "a": 2}, {"q": "Việc tìm hiểu học sinh là công việc:", "o": ["Chủ yếu làm ở đầu năm học, sau đó chỉ bổ sung khi học sinh có vi phạm", "Có thời hạn, hoàn thành trong tuần đầu nhận lớp rồi cập nhật vào cuối kì", "Làm theo từng học kì, tạm dừng trong thời gian giữa hai học kì", "Thường xuyên, liên tục trong suốt năm học"], "a": 3}, {"q": "Khi tìm hiểu học sinh, giáo viên chủ nhiệm cần tránh:", "o": ["Ghi chép, lưu giữ và đối chiếu thông tin thu thập từ nhiều nguồn", "Phân tích nguyên nhân của các hiện trạng trước khi tìm biện pháp giáo dục", "Kết luận nhanh, thiên vị, cảm tính, chủ quan khi đánh giá học sinh", "Phối hợp nhiều cách thức tìm hiểu để có “bức tranh chung” có hệ thống"], "a": 2}, {"q": "Việc phân loại học sinh theo nhiều tiêu chí khác nhau (học lực, hạnh kiểm, nguyên nhân, quan hệ xã hội, tính cách, đối tượng đặc biệt...) nhằm:", "o": ["Có kế hoạch theo dõi, tác động phù hợp với từng nhóm đối tượng học sinh", "Xếp hạng học sinh để phục vụ công tác thi đua, khen thưởng", "Chọn ra các học sinh giỏi để tập trung bồi dưỡng", "Tách riêng học sinh yếu để tổ chức phụ đạo"], "a": 0}, {"q": "Kế hoạch giáo dục của lớp chủ nhiệm là:", "o": ["Danh mục các hoạt động của lớp trong năm học do ban cán sự lập để theo dõi tiến độ thực hiện", "Bản thiết kế chung nội dung giảng dạy các môn học của lớp trong một học kì", "Bản dự kiến thi đua, khen thưởng học sinh trong một giai đoạn cụ thể của năm học", "Bản thiết kế cụ thể toàn bộ nội dung hoạt động giáo dục của lớp, là chương trình hành động thực thi của lớp trong một giai đoạn cụ thể"], "a": 3}, {"q": "Ý nghĩa của kế hoạch giáo dục đối với giáo viên chủ nhiệm KHÔNG bao gồm:", "o": ["Giúp lớp chủ nhiệm chủ động đề ra mục tiêu riêng, độc lập với kế hoạch giáo dục của nhà trường", "Làm cho hoạt động được thực hiện theo một chương trình cụ thể, thống nhất", "Giúp giáo viên và học sinh chủ động, tiết kiệm thời gian, công sức", "Tạo sự thống nhất và huy động sức mạnh tổng hợp của các lực lượng giáo dục"], "a": 0}, {"q": "Căn cứ để xây dựng kế hoạch giáo dục KHÔNG bao gồm:", "o": ["Mục tiêu, nhiệm vụ, kế hoạch giáo dục của nhà trường", "Sở thích và thế mạnh riêng của giáo viên chủ nhiệm đối với một số mảng hoạt động", "Dự báo của giáo viên chủ nhiệm về khả năng phát triển từng mặt của lớp", "Đặc điểm tình hình của địa phương"], "a": 1}, {"q": "Tính toàn diện của kế hoạch giáo dục là:", "o": ["Đề cập tất cả các nội dung giáo dục toàn diện cho học sinh, không xem nhẹ một nội dung nào", "Mô tả chi tiết từng hoạt động, thời gian, nội dung công việc, lực lượng tham gia và dự kiến kết quả", "Nhấn mạnh hoạt động trọng tâm tuỳ theo từng thời gian và từng lớp", "Phân bổ thời gian đồng đều cho mọi nội dung giáo dục trong kế hoạch"], "a": 0}, {"q": "Tính cụ thể của kế hoạch giáo dục thể hiện ở:", "o": ["Đề cập tất cả các nội dung giáo dục toàn diện cho học sinh", "Nhấn mạnh hoạt động trọng tâm tuỳ từng thời gian, từng lớp", "Xác định rõ mục tiêu chung, chỉ tiêu cao và hướng phấn đấu của lớp", "Từng hoạt động, yêu cầu, thời gian, nội dung công việc, biện pháp tiến hành, lực lượng tham gia, dự kiến kết quả"], "a": 3}, {"q": "Tính trọng tâm của kế hoạch giáo dục là:", "o": ["Đề cập đầy đủ mọi nội dung giáo dục, không xem nhẹ nội dung nào", "Tuỳ từng thời gian, từng lớp mà nhấn mạnh hoạt động trọng tâm nào", "Mô tả chi tiết từng hoạt động cùng thời gian, biện pháp và lực lượng tham gia", "Phân bổ thời gian như nhau cho mọi nội dung để đảm bảo tính công bằng"], "a": 1}, {"q": "Bước đầu tiên trong xây dựng kế hoạch giáo dục của lớp chủ nhiệm là:", "o": ["Xác định mục tiêu, chỉ tiêu cần đạt", "Xây dựng nội dung hoạt động giáo dục cụ thể", "Phân tích, đánh giá tình hình, đặc điểm lớp học", "Phân công lực lượng tham gia, thể hiện tiến độ thực hiện"], "a": 2}, {"q": "Bước thứ hai trong xây dựng kế hoạch giáo dục là:", "o": ["Xác định mục tiêu, chỉ tiêu cần đạt", "Xây dựng nội dung hoạt động giáo dục cụ thể", "Xây dựng các biện pháp, điều kiện thực hiện", "Phân tích, đánh giá tình hình, đặc điểm lớp học"], "a": 0}, {"q": "Yêu cầu khi biểu đạt mục tiêu của kế hoạch giáo dục là:", "o": ["Khái quát, mang tính định hướng, vừa sức với lớp, không nhất thiết phải giới hạn thời gian", "Cụ thể, dễ hiểu, có giới hạn thời gian, đặt cao hơn khả năng của lớp để thúc đẩy phấn đấu", "Cụ thể, dễ hiểu, có tính định hướng, đo lường được, áp dụng chung cho mọi lớp, không giới hạn thời gian", "Cụ thể, dễ hiểu, có tính định hướng, có khả năng đo lường được, vừa sức với lớp và có giới hạn về thời gian"], "a": 3}, {"q": "Bước “xây dựng các biện pháp, điều kiện thực hiện” yêu cầu:", "o": ["Lựa chọn cách thức cụ thể, rõ ràng, khả thi, mô tả đầy đủ biện pháp, phương tiện, thiết bị hỗ trợ, hình thức tổ chức phù hợp với từng nội dung", "Nêu các biện pháp chung cho cả kế hoạch, giao học sinh tự lựa chọn phương tiện và hình thức tổ chức", "Nêu mục tiêu chung và phân công người phụ trách cho từng nội dung hoạt động", "Dự kiến thời gian, người phụ trách và kết quả mong đợi của từng nội dung hoạt động"], "a": 0}, {"q": "Việc phân công lực lượng tham gia và thể hiện tiến độ thực hiện nhằm:", "o": ["Giảm bớt công việc của giáo viên bằng cách dồn trách nhiệm cho học sinh", "Tăng số lượng lực lượng tham gia để việc phối hợp giáo dục được rộng hơn", "Gắn công việc với trách nhiệm cá nhân, giúp giáo viên chủ nhiệm dễ theo dõi quá trình và kết quả thực hiện", "Cung cấp số liệu để báo cáo nhà trường theo từng giai đoạn"], "a": 2}, {"q": "Bước cuối cùng “định hướng kiểm tra, đánh giá và điều chỉnh việc thực hiện kế hoạch” yêu cầu giáo viên chủ nhiệm:", "o": ["Dự kiến nội dung kiểm tra vào cuối năm học và nhận xét tổng kết chung về kết quả đạt được", "Dự kiến nội dung, xây dựng tiêu chí và phương pháp kiểm tra, đánh giá; theo dõi, điều chỉnh kịp thời; thu thập thông tin cho các chu kì sau", "Xây dựng tiêu chí kiểm tra, đánh giá và giữ nguyên kế hoạch ban đầu để bảo đảm tính thống nhất", "Theo dõi thường xuyên và thu thập thông tin để điều chỉnh kế hoạch ở thời điểm tổng kết cuối năm"], "a": 1}, {"q": "Thứ tự đúng các bước xây dựng kế hoạch giáo dục của lớp chủ nhiệm là:", "o": ["Phân tích tình hình → Xác định mục tiêu → Xây dựng nội dung → Phân công lực lượng, tiến độ → Xây dựng biện pháp, điều kiện → Kiểm tra, đánh giá, điều chỉnh", "Phân tích tình hình → Xác định mục tiêu → Xây dựng biện pháp, điều kiện → Xây dựng nội dung → Phân công lực lượng, tiến độ → Kiểm tra, đánh giá, điều chỉnh", "Xác định mục tiêu → Phân tích tình hình → Xây dựng nội dung → Xây dựng biện pháp, điều kiện → Phân công lực lượng, tiến độ → Kiểm tra, đánh giá, điều chỉnh", "Phân tích tình hình → Xác định mục tiêu → Xây dựng nội dung → Xây dựng biện pháp, điều kiện → Phân công lực lượng, tiến độ → Kiểm tra, đánh giá, điều chỉnh"], "a": 3}, {"q": "Tập thể là:", "o": ["Một cộng đồng xã hội đặc biệt, hình thái tổ chức xã hội tập hợp những người có cùng mục đích, có hoạt động chung, có tổ chức chặt chẽ và hệ thống quan hệ phụ thuộc giữa các thành viên", "Một cộng đồng xã hội đặc biệt tập hợp những người có cùng mục đích, có hoạt động chung, có tổ chức chặt chẽ nhưng không có quan hệ phụ thuộc giữa các thành viên", "Một hình thái tổ chức hành chính của nhà trường tập hợp học sinh cùng độ tuổi, cùng học và có hoạt động chung", "Một nhóm người có chung mục đích, chung hoạt động và tự phát hình thành hệ thống quan hệ giữa các thành viên"], "a": 0}, {"q": "Đặc trưng nào sau đây KHÔNG phải là đặc trưng chủ yếu của tập thể học sinh?", "o": ["Có mục đích chung có ý nghĩa xã hội", "Có đội ngũ cán bộ tự quản do giáo viên chủ nhiệm chỉ định", "Có hoạt động chung của các thành viên trong tập thể", "Có hệ thống các quan hệ phức hợp"], "a": 1}, {"q": "Hệ thống quan hệ phức hợp trong tập thể học sinh gồm:", "o": ["Chỉ huy – phục tùng, nghĩa vụ – quyền lợi, cạnh tranh – thi đua, tình cảm – trách nhiệm", "Nghĩa vụ – quyền lợi, chỉ huy – phục tùng, phối hợp – tương tác, cạnh tranh – hơn thua", "Nghĩa vụ – quyền lợi, chỉ huy – phục tùng, phối hợp – tương tác, tình cảm – trách nhiệm", "Chỉ huy – phục tùng, phối hợp – tương tác, bạn bè – thân thiết, tình cảm – trách nhiệm"], "a": 2}, {"q": "Trong trường phổ thông, tập thể học sinh là:", "o": ["Môi trường pháp lí – hành chính trực tiếp điều chỉnh hành vi của học sinh", "Môi trường tâm lí – xã hội trực tiếp ảnh hưởng đến học sinh", "Tổ chức giáo dục phụ trợ ngoài chương trình, ảnh hưởng gián tiếp đến học sinh", "Nhóm bạn đồng lứa tự phát, ảnh hưởng đến học sinh thông qua hoạt động vui chơi"], "a": 1}, {"q": "Những phẩm chất nhân cách quan trọng chỉ có thể hình thành trong môi trường giáo dục tập thể là:", "o": ["Tinh thần tập thể, tính kỉ luật, trí nhớ logic, năng lực tự ý thức", "Tinh thần tập thể, năng khiếu, ý thức trách nhiệm, tinh thần hợp tác", "Năng lực tự ý thức, chú ý có chủ định, tính kỉ luật, tinh thần hợp tác", "Tinh thần tập thể, tính kỉ luật, ý thức trách nhiệm, tinh thần hợp tác, năng lực tự ý thức"], "a": 3}, {"q": "Yếu tố nào sau đây KHÔNG thuộc các yếu tố của tập thể có tác dụng là phương tiện giáo dục, điều chỉnh hành vi của học sinh?", "o": ["Truyền đạt và củng cố truyền thống của tập thể", "Dư luận tập thể và kỉ luật tập thể", "Thành tích thi đua của lớp so với các lớp khác trong trường", "Hệ thống viễn cảnh của tập thể"], "a": 2}, {"q": "Tập thể học sinh ở trường phổ thông hình thành và phát triển qua ba giai đoạn theo thứ tự:", "o": ["Tập thể hình thành → Tập thể vững mạnh → Tập thể phát triển", "Tập thể phát triển → Tập thể hình thành → Tập thể vững mạnh", "Tập thể hình thành → Tập thể phát triển → Tập thể phát triển vững mạnh", "Tập thể hình thành → Tập thể phát triển → Tập thể ổn định"], "a": 2}, {"q": "Giai đoạn tập thể hình thành được đặc trưng bởi:", "o": ["Tính tổ chức, kỉ luật rời rạc; học sinh chưa hiểu biết nhau, chưa có quan hệ và hoạt động chung; thường gặp ở lớp đầu cấp một thời gian ngắn sau khi tập hợp", "Dư luận tập thể bắt đầu hình thành nhưng chưa vững chắc, học sinh đã có hoạt động chung, tổ chức và kỉ luật còn yếu", "Sự phân hoá thành ba nhóm, đã có một số yêu cầu hoạt động do tập thể tự đề ra, kỉ luật còn yếu", "Học sinh đã hiểu biết nhau, có hoạt động chung nhưng chưa có đội ngũ cán bộ lớp và chưa có yêu cầu của tập thể"], "a": 0}, {"q": "Giai đoạn tập thể phát triển được đặc trưng bởi sự phân hoá của tập thể thành ba nhóm:", "o": ["Nhóm phần tử tích cực, nhóm cán bộ lớp, nhóm thành viên chậm tiến", "Nhóm hạt nhân nòng cốt, nhóm thành viên khá, nhóm thành viên thụ động", "Nhóm cán bộ lớp, nhóm thành viên thụ động, nhóm thành viên cá biệt", "Nhóm phần tử tích cực (hạt nhân nòng cốt), nhóm thành viên thụ động, nhóm thành viên chậm tiến, cá biệt"], "a": 3}, {"q": "Đặc trưng cơ bản của giai đoạn tập thể phát triển vững mạnh là:", "o": ["Đã có hoạt động chung và các mối quan hệ, nhưng kỉ luật còn yếu và yêu cầu chủ yếu do nhóm cốt cán đề ra", "Dư luận tập thể được hình thành, củng cố vững chắc; tổ chức chặt chẽ, kỉ luật tự giác; yêu cầu của giáo viên chuyển hoá thành yêu cầu của tập thể", "Đã có dư luận tập thể và tổ chức chặt chẽ, nhưng yêu cầu giáo dục vẫn chủ yếu xuất phát từ phía giáo viên", "Tập thể phân hoá thành ba nhóm và đã tự đề ra yêu cầu hoạt động, kỉ luật chung còn yếu"], "a": 1}, {"q": "Tác động sư phạm của giáo viên chủ nhiệm nhất thiết phải hướng đến việc xây dựng tập thể học sinh đạt trình độ phát triển ở giai đoạn:", "o": ["Hình thành", "Phát triển", "Ổn định", "Phát triển vững mạnh"], "a": 3}, {"q": "Việc lựa chọn và phân công đội ngũ cán bộ lớp có thể dựa trên cơ sở:", "o": ["Kết quả học tập, rèn luyện trước đó; thông tin từ giáo viên chủ nhiệm các năm trước; bầu chọn của học sinh; hoặc khuyến khích học sinh tự nhận nhiệm vụ", "Kết quả học tập, rèn luyện trước đó và sự chỉ định của giáo viên chủ nhiệm sau khi tham khảo ý kiến phụ huynh", "Thông tin từ giáo viên chủ nhiệm các năm trước và thứ tự theo danh sách lớp để các em đều có cơ hội", "Bầu chọn của học sinh và đề nghị của ban đại diện cha mẹ học sinh đối với từng chức danh"], "a": 0}, {"q": "Việc quy định rõ chức năng, nhiệm vụ của từng vị trí cán bộ lớp nhằm tránh tình trạng:", "o": ["Cán bộ lớp thiếu uy tín trước tập thể lớp", "Cán bộ lớp thụ động, chờ giáo viên giao việc", "Ôm đồm, giẫm chân nhau hoặc né tránh công việc", "Giáo viên chủ nhiệm mất kiểm soát hoạt động của lớp"], "a": 2}, {"q": "Lớp trưởng là người:", "o": ["Phụ trách chung các mặt, điều hành bộ máy cán bộ lớp, chịu trách nhiệm trước giáo viên chủ nhiệm và tập thể lớp về mọi mặt phát triển của lớp", "Phụ trách chung các mặt, điều hành bộ máy cán bộ lớp, chịu trách nhiệm trước hiệu trưởng và giáo viên chủ nhiệm về mọi mặt của lớp", "Phụ trách học tập và kỉ luật, điều hành các tổ trưởng, chịu trách nhiệm trước giáo viên chủ nhiệm về kết quả của lớp", "Phụ trách chung các mặt, thay giáo viên chủ nhiệm điều hành sinh hoạt lớp, chỉ chịu trách nhiệm trước tập thể lớp"], "a": 0}, {"q": "Lớp phó học tập có nhiệm vụ:", "o": ["Quản lí việc thực hiện nội quy, xây dựng ý thức kỉ luật của học sinh, đề xuất biện pháp củng cố kỉ luật tập thể", "Theo dõi tình hình học tập của lớp, đề xuất và tổ chức các hoạt động xây dựng tinh thần, thái độ học tập tích cực, nâng cao chất lượng học tập", "Theo dõi, đề xuất và tổ chức các hoạt động phong trào học tập, văn nghệ nhằm tăng cường tinh thần đoàn kết trong tập thể", "Quản lí các thành viên trong tổ, theo dõi điểm số và việc chuẩn bị bài của từng thành viên"], "a": 1}, {"q": "Lớp phó kỉ luật chịu trách nhiệm:", "o": ["Theo dõi tình hình học tập, đề xuất và tổ chức hoạt động xây dựng thái độ học tập tích cực của lớp", "Hỗ trợ lớp trưởng điều hành bộ máy cán bộ lớp và quản lí các tổ trưởng trong việc nề nếp", "Quản lí việc thực hiện nội quy, xây dựng ý thức kỉ luật của học sinh, đề xuất và tiến hành biện pháp xây dựng, củng cố kỉ luật tập thể", "Theo dõi, tổ chức các hoạt động văn nghệ, thể thao, tham quan nhằm củng cố tinh thần kỉ luật tập thể"], "a": 2}, {"q": "Lớp phó phong trào chịu trách nhiệm:", "o": ["Theo dõi, đề xuất và tổ chức các hoạt động phong trào như văn nghệ, thể thao, báo chí, tham quan, cắm trại, giao lưu", "Quản lí việc thực hiện nội quy và đề xuất các hoạt động giáo dục kỉ luật cho học sinh trong lớp", "Theo dõi tình hình học tập và tổ chức các phong trào thi đua học tập trong lớp", "Quản lí các thành viên trong tổ và tổ chức các hoạt động của từng tổ"], "a": 0}, {"q": "Cán sự bộ môn có nhiệm vụ:", "o": ["Hỗ trợ lớp trưởng điều hành toàn lớp trong giờ học của môn học mình phụ trách", "Điều hành các tổ trưởng trong việc chuẩn bị bài và kiểm tra bài cũ của môn học", "Tổ chức các phong trào thi đua học tập theo từng môn học trong phạm vi cả lớp", "Hỗ trợ lớp phó học tập trong phạm vi môn học mình phụ trách, giúp bạn học tốt bộ môn"], "a": 3}, {"q": "Các kĩ năng cơ bản giáo viên chủ nhiệm cần hướng dẫn cho cán bộ lớp gồm:", "o": ["Ghi chép sổ công tác, lập kế hoạch hoạt động, điều hành giờ học, trình bày bài giảng, hướng dẫn bạn học", "Ghi chép sổ công tác, lập kế hoạch hoạt động, điều hành sinh hoạt lớp, trình bày thuyết phục, vận động, tổ chức hoạt động tập thể", "Ghi chép sổ công tác, quản lí tài chính của lớp, điều hành sinh hoạt lớp, trình bày thuyết phục, vận động", "Lập kế hoạch hoạt động, điều hành sinh hoạt lớp, giải quyết xung đột, xử lí kỉ luật, tổ chức hoạt động tập thể"], "a": 1}, {"q": "Đối với cán bộ lớp, giáo viên chủ nhiệm cần:", "o": ["Giao việc và chỉ kiểm tra khi có kết quả cuối cùng, tránh can thiệp để cán bộ lớp tự chủ", "Làm thay khi cán bộ lớp gặp khó khăn để đảm bảo hiệu quả công việc của lớp", "Thực hiện đúng vai trò cố vấn, mạnh dạn giao việc, tin tưởng; kiểm tra, đánh giá, động viên kịp thời; xây dựng, củng cố và bảo vệ uy tín của cán bộ lớp", "Giao việc, tin tưởng, nhưng chỉ phê bình khi có sai sót để giữ nghiêm kỉ cương của lớp"], "a": 2}, {"q": "Mục tiêu ngắn hạn của tập thể học sinh là:", "o": ["Mục tiêu khó hơn, đòi hỏi tương đối nhiều thời gian, lôi cuốn sự chú ý của học sinh trong thời gian dài", "Mục tiêu đơn giản, thực hiện trong một tháng đến một học kì, tạo trạng thái mong đợi hứng thú cho tập thể", "Mục tiêu như thi tốt nghiệp, thi đại học, buộc học sinh tập trung chuẩn bị trong sự hưng phấn chờ đợi", "Mục tiêu đơn giản, thời gian thực hiện ngắn (một tuần, một tháng), như những viễn cảnh gần tạo trạng thái mong đợi hứng thú"], "a": 3}, {"q": "Mục tiêu dài hạn của tập thể học sinh có ví dụ là:", "o": ["Buổi biểu diễn văn nghệ của lớp vào tuần sau, đòi hỏi cả lớp cùng tập luyện", "Kế hoạch cắm trại cuối năm âm lịch, mục tiêu thi tốt nghiệp, thi đại học", "Hoàn thành việc trang trí lớp học và đồ dùng học tập trong tháng này", "Duy trì nề nếp trực nhật và chuẩn bị bài hằng ngày của các tổ"], "a": 1}, {"q": "Yêu cầu giáo dục đối với học sinh cần:", "o": ["Phù hợp mục tiêu chung và khả năng của học sinh; thống nhất trong tập thể; giữ ổn định mức độ khó để học sinh quen dần; có theo dõi, kiểm tra", "Phù hợp mục tiêu chung của tập thể; có độ khó tăng dần; được giải thích ý nghĩa, nhưng việc thực hiện hoàn toàn do học sinh tự giác", "Phù hợp mục tiêu chung và khả năng thực hiện; thống nhất trong tập thể; có độ khó tăng dần; được giải thích ý nghĩa, theo dõi, hướng dẫn, kiểm tra trong quá trình thực hiện", "Đưa ra một cách kiên quyết, được giải thích rõ ý nghĩa, học sinh tự giác thực hiện nên không cần kiểm tra, đánh giá thường xuyên"], "a": 2}, {"q": "Kỉ luật tích cực là:", "o": ["Kết quả của quá trình giáo dục ý thức ở học sinh, kết quả của những cố gắng tự giác, tích cực của tập thể", "Hệ thống quy định do giáo viên ban hành và giám sát chặt chẽ để học sinh tuân thủ", "Thói quen chấp hành quy định chung được hình thành nhờ khen thưởng và xử phạt nghiêm minh", "Sự tuân thủ các quy định chung của lớp dưới sự giám sát thường xuyên của cán bộ lớp"], "a": 0}, {"q": "Dư luận tập thể lành mạnh:", "o": ["Phản ánh đánh giá của đa số thành viên về vấn đề của lớp, do giáo viên định hướng nhưng ít tác động đến hành vi cá nhân", "Là ý kiến thống nhất của cán bộ lớp về các vấn đề của tập thể, có tác dụng điều chỉnh hành vi học sinh", "Phản ánh quan niệm, đánh giá của giáo viên và nhà trường về hành vi học sinh, có tác dụng định hướng ý thức", "Phản ánh quan niệm, nhận định, đánh giá đúng đắn của tập thể; có tác dụng điều khiển, điều chỉnh mạnh mẽ ý thức, thái độ, hành vi của học sinh"], "a": 3}, {"q": "Biện pháp nào sau đây KHÔNG phải là biện pháp giáo dục truyền thống tốt và hình thành dư luận tập thể lành mạnh?", "o": ["Tìm hiểu, nắm vững đặc điểm lớp và học sinh, xác định mặt mạnh, mặt yếu của lớp", "Tập trung xử lí kỉ luật nghiêm các vi phạm để răn đe, hạn chế tổ chức tranh luận trong lớp", "Phát huy vai trò mạng lưới tự quản và những phần tử tích cực trong lớp", "Tổ chức họp lớp, diễn đàn tập thể như báo tường, tập san, bảng thông tin"], "a": 1}, {"q": "Giáo dục truyền thống tốt là:", "o": ["Bảo tồn các nề nếp đã có của lớp qua các năm học, không để thay đổi", "Ghi nhớ và duy trì những thành tích mà lớp đã đạt được qua các năm", "Hình thành cho học sinh ý thức giữ gìn, phát huy, phát triển những mặt mạnh của lớp", "Tổ chức các lễ kỉ niệm để học sinh hiểu và tự hào về lịch sử của lớp"], "a": 2}, {"q": "Nhiệm vụ quan trọng hàng đầu của giáo viên chủ nhiệm trong tổ chức hoạt động giáo dục toàn diện là:", "o": ["Tổ chức có kế hoạch hoạt động học tập nhằm nâng cao kết quả học tập của học sinh", "Tổ chức các hoạt động trải nghiệm nhằm hình thành kĩ năng sống cho học sinh", "Xây dựng nề nếp, kỉ luật nhằm bảo đảm an toàn và trật tự trong lớp học", "Tổ chức hoạt động lao động, thể thao nhằm phát triển thể chất cho học sinh"], "a": 0}, {"q": "Kết quả hoạt động học tập của học sinh thể hiện ở:", "o": ["Kết quả nắm vững tri thức, kĩ năng, kĩ xảo và điểm số đạt được qua các bài kiểm tra", "Điểm số, xếp loại học lực và thứ hạng của học sinh trong lớp", "Mức độ chuyên cần, thái độ học tập và kết quả nắm vững tri thức, kĩ năng", "Kết quả nắm vững tri thức, kĩ năng, kĩ xảo và kết quả phát triển phẩm chất, năng lực của học sinh"], "a": 3}, {"q": "Khi xây dựng nội quy học tập, giáo viên nên:", "o": ["Tự đề ra nội quy theo quy định của nhà trường, học sinh có thể góp ý sau khi thực hiện", "Tham khảo ý kiến đóng góp của học sinh, vì nội quy thống nhất giữa giáo viên và học sinh có hiệu quả kép", "Giao cán bộ lớp soạn thảo nội quy rồi thông qua trước tập thể để học sinh tự giám sát", "Áp dụng nội quy mẫu của nhà trường để bảo đảm tính thống nhất giữa các lớp"], "a": 1}, {"q": "Nội quy, yêu cầu học tập cần hướng vào các vấn đề:", "o": ["Chuyên cần; thái độ học tập; tổ chức học tập; sử dụng đồ dùng học tập; điểm số và xếp loại học lực", "Chuyên cần; thái độ học tập; chuẩn bị đồ dùng học tập; quy định khen thưởng nhưng không quy định kỉ luật", "Chuyên cần; tinh thần, thái độ học tập; tổ chức học tập; sử dụng, bảo vệ, chuẩn bị đồ dùng học tập; quy định khen thưởng, kỉ luật việc thực hiện nội quy", "Chuyên cần; trang phục; tổ chức học tập; bảo vệ đồ dùng học tập; quy định khen thưởng, kỉ luật"], "a": 2}, {"q": "Nếu giáo viên giao nhiệm vụ học tập không phù hợp thì:", "o": ["Học sinh khá giỏi xong sớm mà không được giao thêm bài sẽ gây mất trật tự; học sinh gặp nhiệm vụ quá khó sẽ sao nhãng và dẫn tới vi phạm kỉ luật", "Học sinh khá giỏi sẽ sao nhãng vì nhiệm vụ quá dễ; học sinh yếu sẽ chủ động cố gắng hơn để theo kịp bạn", "Học sinh khá giỏi xong sớm sẽ giúp đỡ bạn nên giữ được trật tự; học sinh gặp nhiệm vụ quá khó sẽ nản chí và bỏ học", "Học sinh khá giỏi xong sớm sẽ mất hứng thú với môn học; học sinh yếu bị áp lực nhưng vẫn giữ được kỉ luật"], "a": 0}, {"q": "Khi đổi mới phương pháp dạy học, giáo viên cần:", "o": ["Chú ý theo dõi những học sinh tích cực trả lời để làm nòng cốt lôi cuốn cả lớp tham gia", "Đa dạng hoá hình thức dạy học cho học sinh giỏi và giao nhiệm vụ đơn giản cho học sinh yếu", "Hướng dẫn học sinh phương pháp học tập tích cực, ưu tiên hình thức làm việc cá nhân để đảm bảo hiệu quả", "Làm cho tất cả học sinh ở các trình độ khác nhau đều thực hiện nhiệm vụ học tập bằng nhiều hình thức: nghĩ, nói, viết..."], "a": 3}, {"q": "Phong trào thi đua “Xây dựng trường học thân thiện, học sinh tích cực” do Bộ Giáo dục và Đào tạo phát động trong giai đoạn:", "o": ["2005 – 2010", "2008 – 2013", "2009 – 2014", "2010 – 2015"], "a": 1}, {"q": "Về khen thưởng học sinh, cần:", "o": ["Đặt ra tiêu chuẩn ở một mức chung, hình thức khen thưởng đơn giản, thực hiện thường xuyên, chú ý nêu gương điển hình", "Đặt ra tiêu chuẩn với nhiều mức độ, hình thức khen thưởng đa dạng, chỉ tiến hành vào cuối học kì và cuối năm học", "Đặt ra tiêu chuẩn với nhiều mức độ, nhiều hình thức; tiến hành thường xuyên, định kì (tuần, tháng, học kì, cuối năm); chú ý nêu gương, xây dựng điển hình học tốt", "Đặt ra tiêu chuẩn với nhiều mức độ, tiến hành định kì, chủ yếu khen ở cấp trường để tạo động lực phấn đấu"], "a": 2}, {"q": "Đối với học sinh yếu kém, giáo viên chủ nhiệm trước hết cần:", "o": ["Tổ chức phụ đạo ngay để bù đắp những lỗ hổng kiến thức cho học sinh", "Tìm cách khắc phục lỗ hổng kiến thức bằng cải tiến phương pháp dạy học, đề ra bài tập vừa sức, khen kịp thời khi tiến bộ; nếu vẫn không hiệu quả thì tổ chức phụ đạo", "Giao thêm bài tập nhằm củng cố kiến thức, tăng cường kiểm tra để theo dõi sự tiến bộ", "Trao đổi với cha mẹ học sinh để phối hợp nhắc nhở, giám sát việc học ở nhà"], "a": 1}, {"q": "Hoạt động nhóm trong dạy học hợp tác là môi trường đa mục đích, tương ứng với ba khía cạnh:", "o": ["Học để biết, học để làm, học để cùng chung sống", "Học để biết, học để làm, học để khẳng định mình", "Học để biết, học để thi, học để cùng chung sống", "Học để hiểu, học để làm, học để cùng chung sống"], "a": 0}, {"q": "Hoạt động trải nghiệm và các hoạt động giáo dục khác là những hoạt động:", "o": ["Được tổ chức song song với hoạt động dạy học, phụ thuộc vào kết quả học tập các môn học của học sinh", "Được tổ chức song song và độc lập với dạy học, thiên về vui chơi giải trí, mục đích giáo dục là thứ yếu", "Được tích hợp trong hoạt động dạy học các môn học, thống nhất trong mục đích giáo dục nhân cách", "Được tổ chức song song và độc lập với hoạt động dạy học các môn học nhưng thống nhất trong mục đích giáo dục hình thành, phát triển toàn diện nhân cách học sinh"], "a": 3}, {"q": "Chương trình Hoạt động trải nghiệm (tiểu học) và Hoạt động trải nghiệm, hướng nghiệp (THCS, THPT) là chương trình:", "o": ["Bắt buộc, được xây dựng từ nâng cao ở lớp đầu cấp đến đơn giản, thu hẹp dần ở lớp cuối cấp", "Bắt buộc, được xây dựng theo mạch nội dung từ đơn giản ở lớp đầu cấp đến nâng cao, mở rộng dần ở lớp cuối cấp", "Bắt buộc ở cấp tiểu học, tự chọn ở cấp THCS và THPT tuỳ theo điều kiện nhà trường", "Tự chọn, xây dựng theo mạch nội dung từ đơn giản đến nâng cao tuỳ năng lực học sinh"], "a": 1}, {"q": "Các loại hình hoạt động trải nghiệm ở trường phổ thông gồm:", "o": ["Sinh hoạt dưới cờ, hoạt động giáo dục theo chủ đề và hoạt động câu lạc bộ", "Sinh hoạt dưới cờ, Sinh hoạt lớp và hoạt động giáo dục ngoại khoá", "Sinh hoạt dưới cờ, hoạt động giáo dục theo chủ đề và Sinh hoạt lớp", "Hoạt động giáo dục theo chủ đề, Sinh hoạt lớp và hoạt động thi đua"], "a": 2}, {"q": "Trong các loại hình hoạt động trải nghiệm, giáo viên chủ nhiệm là người phụ trách chính:", "o": ["Tiết Sinh hoạt lớp", "Sinh hoạt dưới cờ", "Hoạt động giáo dục theo chủ đề của toàn trường", "Hoạt động giáo dục ngoại khoá của khối lớp"], "a": 0}, {"q": "Lĩnh vực nào sau đây KHÔNG nằm trong nội dung tổ chức hoạt động giáo dục ngoại khoá?", "o": ["Chính trị – xã hội; khoa học – kĩ thuật", "Văn hoá – nghệ thuật; thể dục thể thao", "Vui chơi – giải trí; lao động công ích; định hướng nghề nghiệp", "Kinh doanh – thương mại; dịch vụ"], "a": 3}, {"q": "Lớp học là:", "o": ["Một đơn vị hành chính của nhà trường, có chức năng tổ chức học sinh theo độ tuổi để thực hiện chương trình", "Một tập thể học sinh, một tổ chức giáo dục có kỉ luật chặt chẽ, có nguyên tắc hoạt động nhất định, có chức năng tổ chức, quản lí, giáo dục học sinh nhằm thực hiện mục đích giáo dục", "Một nhóm học sinh cùng độ tuổi học chung, do giáo viên phụ trách chuyên môn quản lí, giáo dục", "Một tổ chức tự quản của học sinh, có kỉ luật chặt chẽ, hoạt động độc lập với giáo viên chủ nhiệm"], "a": 1}, {"q": "Môi trường giáo dục lớp học an toàn bao gồm:", "o": ["Môi trường vật chất lớp học và môi trường học tập trực tuyến", "Môi trường vật chất lớp học và môi trường văn hoá – kĩ thuật", "Môi trường vật chất lớp học và môi trường tâm lí – xã hội", "Môi trường tâm lí – xã hội và môi trường học tập chính khoá"], "a": 2}, {"q": "Môi trường vật chất lớp học gồm:", "o": ["Bầu không khí giao tiếp, trang trí, trang thiết bị và học liệu phục vụ học tập", "Không gian, trang trí, trang thiết bị, đồ dùng và mối quan hệ giữa giáo viên với học sinh", "Không gian, đồ dùng, học liệu và phong cách làm việc, sự gương mẫu của giáo viên", "Không gian lớp học, trang trí, trang thiết bị, đồ dùng, đồ chơi, học liệu phục vụ học tập, rèn luyện"], "a": 3}, {"q": "Môi trường tâm lí – xã hội lớp học gồm:", "o": ["Bầu không khí giao tiếp, phong cách làm việc, sự gương mẫu của giáo viên, mối quan hệ giữa giáo viên với học sinh, học sinh với học sinh", "Bầu không khí giao tiếp, học liệu, phong cách làm việc của giáo viên, mối quan hệ giữa học sinh với học sinh", "Bầu không khí giao tiếp, trang thiết bị, sự gương mẫu của giáo viên, mối quan hệ giữa giáo viên với học sinh", "Phong cách làm việc, diện tích không gian, sự gương mẫu của giáo viên, mối quan hệ giữa học sinh với nhau"], "a": 0}, {"q": "Môi trường vật chất lớp học an toàn cần:", "o": ["Cố định, ổn định để học sinh quen thuộc, khai thác triệt để tác dụng giáo dục, tránh lãng phí", "Được sắp xếp, trang trí hợp lí, thẩm mĩ, thân thiện, thuận tiện, linh hoạt, dễ thay đổi; khai thác triệt để tác dụng giáo dục, tránh lãng phí", "Đúng quy định, trang bị hiện đại, đầy đủ, ưu tiên các thiết bị đắt tiền để nâng cao hứng thú học tập", "Trang trí phong phú, hấp dẫn, để học sinh tự khai thác mà không cần giáo viên giữ vai trò chủ đạo"], "a": 1}, {"q": "Khi xây dựng môi trường tâm lí – xã hội lớp học an toàn, giáo viên:", "o": ["Nhẹ nhàng, gần gũi, yêu thương nhưng nghiêm khắc, phạt nhẹ khi học sinh vi phạm để giữ nề nếp", "Nghiêm khắc, đúng nội quy, ưu tiên quan tâm các học sinh giỏi để làm gương cho cả lớp", "Nhẹ nhàng, gần gũi, yêu thương, không chửi bới, mắng, đánh phạt học sinh; tạo cho học sinh cảm giác ở lớp giống như ở nhà", "Giữ khoảng cách vừa phải, giải thích rõ ràng, chủ yếu dựa vào nội quy để quản lí học sinh"], "a": 2}, {"q": "Tiêu chí đánh giá lớp học an toàn (môi trường vật chất) bao gồm:", "o": ["Cơ sở vật chất, diện tích lớp học, số lượng học sinh giỏi, trang thiết bị, học liệu phục vụ học tập", "Trang thiết bị, đồ dùng, học liệu; số lượng cán bộ lớp; phân chia góc học tập; kết quả học tậ const NAMES = {1:'Chương 1',2:'Chương 2',3:'Chương 3',4:'Chương 4'};
const SUBS = {
  1:'Chương 1 · Hoạt động sư phạm · Nhân cách giáo viên · Bản chất giáo dục',
  2:'Chương 2 · Giáo dục học',
  3:'Chương 3 · Giáo dục phổ thông Việt Nam và hoạt động giáo dục ở nhà trường phổ thông',
  4:'Chương 4 · Công tác chủ nhiệm lớp ở trường phổ thông'
};
const LS_KEY='ongdh_cauhaysai_v1', LS_AUTO='ongdh_autosave_v1';
let weak = {1:[],2:[],3:[],4:[]};
let autoSave = false;
try{
  const w = JSON.parse(localStorage.getItem(LS_KEY)||'null');
  if(w) [1,2,3,4].forEach(c=>{ if(Array.isArray(w[c])) weak[c]=w[c].filter(i=>Number.isInteger(i)&&CH[c][i]); });
  autoSave = localStorage.getItem(LS_AUTO)==='1';
}catch(e){}
function persist(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(weak)); localStorage.setItem(LS_AUTO,autoSave?'1':'0'); }catch(e){}
}

let mode='quiz';            // 'quiz' = làm bài, 'weak' = câu hay sai
let cur=1, order=[], state={}, curIdx=-1;
const SESS={};
const skey=()=>mode+cur;

function shuffleArr(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function mkQ(c,i){
  const q=CH[c][i];
  return {id:i,text:q.q,opts:q.o.map((t,k)=>({t,ok:k===q.a}))};
}

function build(doShuffle){
  state={};
  let qs = mode==='quiz' ? CH[cur].map((_,i)=>mkQ(cur,i)) : weak[cur].map(i=>mkQ(cur,i));
  if(doShuffle){ shuffleArr(qs); qs.forEach(q=>shuffleArr(q.opts)); }
  order=qs;
  SESS[skey()]={order,state};
  render();
}

function setStar(b,saved){
  b.className='star'+(saved?' on':'');
  b.textContent = saved ? '★ Đã lưu vào câu hay sai' : '☆ Lưu vào câu hay sai';
}

function render(){
  document.body.classList.toggle('weak', mode==='weak');
  const list=document.getElementById('list'), nav=document.getElementById('nav');
  list.innerHTML=''; nav.innerHTML='';
  if(mode==='weak' && order.length===0){
    const d=document.createElement('div'); d.className='empty';
    d.innerHTML='<div class="big">⭐</div><b>Chưa có câu nào trong mục này ('+NAMES[cur]+')</b><br>'+
      'Hãy qua mục <b>Làm bài</b> và bấm <b>☆ Lưu vào câu hay sai</b> ở những câu bạn hay nhầm, '+
      'hoặc bật <b>Tự lưu câu làm sai</b> ở thanh trên.';
    list.appendChild(d);
  }
  order.forEach((q,idx)=>{
    const a=document.createElement('a'); a.href='#q'+idx; a.textContent=idx+1; a.id='n'+idx; nav.appendChild(a);
    const box=document.createElement('div'); box.className='q'; box.id='q'+idx;
    const h=document.createElement('h3'); h.innerHTML='<span>Câu '+(idx+1)+'.</span> '; h.append(q.text);
    if(mode==='weak'){
      const t=document.createElement('small'); t.className='tag'; t.textContent=' (câu gốc số '+(q.id+1)+')'; h.appendChild(t);
    }
    box.appendChild(h);
    q.opts.forEach((o,k)=>{
      const b=document.createElement('button'); b.className='opt';
      b.innerHTML='<span class="k">'+'ABCD'[k]+'</span><span></span>';
      b.lastChild.textContent=o.t;
      b.onclick=()=>choose(idx,k);
      box.appendChild(b);
    });
    const fb=document.createElement('div'); fb.className='fb'; box.appendChild(fb);
    const acts=document.createElement('div'); acts.className='acts';
    if(mode==='quiz'){
      const s=document.createElement('button');
      setStar(s, weak[cur].includes(q.id));
      s.onclick=()=>toggleSaved(idx,s);
      acts.appendChild(s);
    }else{
      const d=document.createElement('button'); d.className='del';
      d.textContent='✓ Đã nhớ – xoá khỏi danh sách';
      d.onclick=()=>removeWeak(idx);
      acts.appendChild(d);
    }
    box.appendChild(acts);
    list.appendChild(box);
    if(state[idx]!==undefined) applyChoice(idx,state[idx]);
  });
  update();
  curIdx=-1; markCurrent();
}

function applyChoice(idx,k){
  const q=order[idx], box=document.getElementById('q'+idx);
  const btns=box.querySelectorAll('.opt');
  btns.forEach((b,i)=>{ b.disabled=true; if(q.opts[i].ok) b.classList.add('correct'); });
  const fb=box.querySelector('.fb');
  if(q.opts[k].ok){
    fb.innerHTML='<b class="ok-t">✔ Chính xác!</b>';
  }else{
    btns[k].classList.add('wrong');
    const right=q.opts.findIndex(o=>o.ok);
    fb.innerHTML='<b class="bad-t">✘ Chưa đúng.</b> Đáp án đúng: '+'ABCD'[right];
  }
  document.getElementById('n'+idx).classList.add(q.opts[k].ok?'ok':'bad');
}

function choose(idx,k){
  if(state[idx]!==undefined) return;
  state[idx]=k;
  applyChoice(idx,k);
  if(mode==='quiz' && autoSave && !order[idx].opts[k].ok && !weak[cur].includes(order[idx].id)){
    weak[cur].push(order[idx].id); persist();
    const s=document.querySelector('#q'+idx+' .star'); if(s) setStar(s,true);
  }
  update();
}

function toggleSaved(idx,btn){
  const id=order[idx].id, l=weak[cur], p=l.indexOf(id);
  if(p>=0) l.splice(p,1); else l.push(id);
  persist();
  setStar(btn, p<0);
  update();
}

function removeWeak(idx){
  const id=order[idx].id;
  weak[cur]=weak[cur].filter(x=>x!==id);
  persist();
  order.splice(idx,1);
  const ns={};
  for(const i in state){ const n=+i; if(n<idx) ns[n]=state[n]; else if(n>idx) ns[n-1]=state[n]; }
  state=ns;
  SESS[skey()]={order,state};
  render();
}

function buildTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  [1,2,3,4].forEach(c=>{
    const b=document.createElement('button'); b.className='tab'; b.id='tab'+c;
    b.onclick=()=>switchTab(c);
    t.appendChild(b);
  });
}

function updateTabs(){
  [1,2,3,4].forEach(c=>{
    const b=document.getElementById('tab'+c);
    if(mode==='quiz'){
      const done = c===cur ? Object.keys(state).length : (SESS['quiz'+c]?Object.keys(SESS['quiz'+c].state).length:0);
      const total = CH[c].length;
      b.className='tab'+(c===cur?' active':'')+(done===total?' full':'');
      b.innerHTML=NAMES[c]+' <small>'+done+'/'+total+'</small>';
    }else{
      b.className='tab'+(c===cur?' active':'');
      b.innerHTML=NAMES[c]+' <small>'+weak[c].length+' câu hay sai</small>';
    }
  });
}

function updateModes(){
  const n=[1,2,3,4].reduce((s,c)=>s+weak[c].length,0);
  const q=document.getElementById('mode-quiz'), w=document.getElementById('mode-weak');
  q.className='mode'+(mode==='quiz'?' active':'');
  w.className='mode'+(mode==='weak'?' active':'');
  q.textContent='📘 Làm bài';
  w.innerHTML='⭐ Câu hay sai <span class="badge">'+n+'</span>';
}

function update(){
  const total=order.length, done=Object.keys(state).length;
  let right=0; for(const i in state){ if(order[i].opts[state[i]].ok) right++; }
  document.getElementById('total').textContent=total;
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('wrong').textContent=done-right;
  document.getElementById('pbar').style.width=(total?done/total*100:0)+'%';
  document.getElementById('sub').textContent = mode==='quiz' ? SUBS[cur] : '⭐ Câu hay sai · '+NAMES[cur];
  const r=document.getElementById('result');
  if(total>0 && done===total){
    const pct=Math.round(right/total*100);
    document.getElementById('rtitle').textContent=(mode==='weak'?'Ôn câu hay sai – ':'')+NAMES[cur]+' – Kết quả: '+right+'/'+total+' ('+pct+'%)';
    document.getElementById('rtext').textContent = mode==='weak'
      ? 'Câu nào đã nhớ rồi thì bấm “Đã nhớ – xoá khỏi danh sách”, câu chưa nhớ cứ để lại ôn tiếp.'
      : (pct>=80?'Rất tốt! Bạn nắm vững nội dung.':
         pct>=50?'Khá ổn, hãy xem lại các câu sai (màu đỏ ở bảng số câu) rồi làm lại.':
         'Hãy đọc lại giáo trình và thử lại nhé!');
    r.style.display='block';
  } else r.style.display='none';
  updateTabs(); updateModes();
}

function loadSession(){
  if(mode==='quiz' && SESS['quiz'+cur]){ order=SESS['quiz'+cur].order; state=SESS['quiz'+cur].state; render(); }
  else build(false);               // mục câu hay sai luôn lấy danh sách mới nhất
}
function switchTab(c){
  if(c===cur) return;
  SESS[skey()]={order,state};
  cur=c; loadSession();
  window.scrollTo({top:0,behavior:'smooth'});
}
function setMode(m){
  if(m===mode) return;
  SESS[skey()]={order,state};
  mode=m; loadSession();
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetQuiz(shuf){ build(shuf); window.scrollTo({top:0,behavior:'smooth'}); }
document.getElementById('reset').onclick=()=>resetQuiz(false);
document.getElementById('shuffle').onclick=()=>resetQuiz(true);
document.getElementById('mode-quiz').onclick=()=>setMode('quiz');
document.getElementById('mode-weak').onclick=()=>setMode('weak');
const autoBox=document.getElementById('auto');
autoBox.checked=autoSave;
autoBox.onchange=()=>{ autoSave=autoBox.checked; persist(); };

function setBarH(){const b=document.querySelector('.bar');document.documentElement.style.setProperty('--barh',b.offsetHeight+'px');}
window.addEventListener('resize',setBarH);

function markCurrent(){
  const line=window.innerHeight*0.35; let found=0;
  document.querySelectorAll('.q').forEach((el,i)=>{ if(el.getBoundingClientRect().top<=line) found=i; });
  if(found!==curIdx){
    const old=document.getElementById('n'+curIdx); if(old) old.classList.remove('cur');
    const n=document.getElementById('n'+found); if(n){ n.classList.add('cur');
      const nav=document.getElementById('nav');
      if(nav.scrollWidth>nav.clientWidth) nav.scrollTo({left:n.offsetLeft-nav.clientWidth/2,behavior:'smooth'});
      else if(nav.scrollHeight>nav.clientHeight) nav.scrollTo({top:n.offsetTop-nav.clientHeight/2,behavior:'smooth'}); }
    curIdx=found;
  }
}
window.addEventListener('scroll',markCurrent,{passive:true});
document.getElementById('nav').addEventListener('click',e=>{
  const a=e.target.closest('a'); if(!a) return; e.preventDefault();
  document.getElementById('q'+a.id.slice(1)).scrollIntoView({behavior:'smooth',block:'start'});
});

buildTabs();
build(false);
setBarH();
</script>
</body>
</html>
